<script>
/* If anything stops the game from starting (or breaks later), say so on screen instead of leaving a blank page. */
(function () {
  var shown = 0;
  function show(msg) {
    if (shown++ > 2) return;
    var d = document.getElementById('errbox');
    if (!d) { d = document.createElement('div'); d.id = 'errbox'; d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;padding:10px 12px;border-radius:6px;background:rgba(40,6,4,.95);color:#ffd9c8;font:600 13px/1.35 system-ui,sans-serif;box-shadow:0 0 0 1px #000,0 0 0 2px #c44,0 6px 20px rgba(0,0,0,.6);white-space:pre-wrap;word-break:break-word';
      d.onclick = function () { d.remove(); shown = 0; };
      (document.body || document.documentElement).appendChild(d); }
    d.textContent = (d.textContent ? d.textContent + '\n' : 'Something went wrong (tap to close). Please screenshot this for Claude:\n') + msg;
  }
  window.__showErr = show;
  window.addEventListener('error', function (e) { if (e && e.message) show(e.message + (e.lineno ? ' (line ' + e.lineno + ':' + e.colno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });
})();
</script>

<style>
/* Layout: one-screen RTS HUD. Resource bar on top, framed battlefield canvas in the middle,
   carved-stone console (portrait + unit info | 4x3 command card) at the bottom; console moves to the side in short landscape. */
:root{
  color-scheme: dark;
  --ink:#070b0b;
  --stone:#1b2627;
  --gold:#d4ab57;
  --gold-hi:#f5e09a;
  --gold-lo:#245d64;
  --parch:#ecdfc2;
  --muted:#81a19d;
  --blood:#d04a3c;
  --good:#95c070;
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-deco:var(--f-display);
  --f-ui:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --btn:clamp(40px,12.6vw,58px);
  --sa-t:env(safe-area-inset-top,0px);--sa-r:env(safe-area-inset-right,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);
  --vw-safe:calc(100vw - var(--sa-l) - var(--sa-r));--vh-safe:calc(100dvh - var(--sa-t) - var(--sa-b));
  --trim:linear-gradient(90deg,var(--gold-lo),var(--gold-hi) 25%,var(--gold) 50%,var(--gold-hi) 75%,var(--gold-lo));
  --noise:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .32 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--parch);font:500 15px/1.3 var(--f-ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "stage" "console"}

/* --- top resource bar --- */
#bar{grid-area:bar;display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
  background:var(--noise),linear-gradient(#253536,#131b1c);border-bottom:3px solid;border-image:var(--trim) 1;position:relative;z-index:2;box-shadow:0 4px 10px rgba(0,0,0,.6)}
.res{display:flex;align-items:center;gap:5px;font:800 16px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--gold-hi);text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8);
  background:rgba(0,0,0,.4);padding:4px 8px 4px 5px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);min-width:0}
.res b{font-weight:800}
#rGold{position:relative}
.stkb{position:absolute;right:-5px;bottom:-8px;padding:2px 4px 2px 3px;border-radius:7px;font:800 9.5px/1 var(--f-ui);color:#1a1204;background:linear-gradient(#ffe9a0,#d8a83a);box-shadow:0 0 0 1px #000,0 0 8px rgba(255,200,80,.5);text-shadow:none;pointer-events:none;z-index:2}
.stkb[hidden]{display:none}
.ico{width:18px;height:18px;flex:none;display:block}
.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#faf2ce 0 12%,#f2cf62 26%,#b8832a 70%,#1b555c 100%);box-shadow:0 0 0 1px #0e2d31,inset 0 0 0 2px rgba(30,96,103,.35)}
#rGold .int{font:800 11px/1 var(--f-ui);color:#9be872;margin-left:1px;letter-spacing:0}
#rGold .int:empty{display:none}
#rGold{position:relative}
@media (max-width:440px){#rGold .int{position:absolute;right:-5px;top:-8px;padding:2px 4px;border-radius:7px;font-size:9.5px;background:#0f1a08;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #2a5a14}}
#rLives b{color:var(--parch)}

.hbtn{flex:none;min-width:38px;height:32px;padding:0 8px;border:0;border-radius:3px;cursor:pointer;font:800 14px/1 var(--f-ui);color:var(--gold-hi);
  background:linear-gradient(#284144,#162526);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #8a6a2c,inset 0 2px 0 rgba(255,255,255,.12);touch-action:manipulation;display:grid;place-items:center}

/* talents button: rune-stone icon, gold badge with unspent points that glows while > 0 */
#bTal,#bBag{position:relative;display:flex;align-items:center;justify-content:center;gap:6px}
#bTal.lock{opacity:.45;filter:grayscale(.8)}

#bTal .hl,#bBag .hl{display:none;font:400 14px/1 var(--f-display);letter-spacing:.05em}
#bBag .badge{display:none;position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font:800 12px/18px var(--f-ui);text-align:center;color:#fff;background:radial-gradient(circle at 40% 28%,#e7d4ff,#a35cff 55%,#5a2a9a);box-shadow:0 0 0 1px #000,0 0 8px rgba(190,130,255,.8)}
#bBag.has .badge{display:block;animation:tpBadge 1.3s ease-in-out infinite}
#bBag.bump,#bShop.bump{animation:bagBump .45s ease-out}
/* the Shop button (6 Nov 2026): a coin stall and the word, so it reads at a glance; on phones the word alone */
#bShop{display:flex;align-items:center;justify-content:center;gap:5px;padding:0 9px}
#bShop svg{width:18px;height:18px;flex:none}
#bShop .sl{font:800 13px/1 var(--f-ui);letter-spacing:.04em;text-transform:uppercase}
@keyframes bagBump{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
#bTal .badge{display:none;position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font:800 12px/18px var(--f-ui);text-align:center;font-variant-numeric:tabular-nums;color:#0a2023;
  background:radial-gradient(circle at 40% 28%,#faf3d4,#e4c568 50%,#b47c1d);box-shadow:0 0 0 1px #000,0 0 8px rgba(240,208,125,.75)}
#bTal.has .badge{display:block;animation:tpBadge 1.3s ease-in-out infinite}
#bTal.pp .badge{color:#0a1a04;background:radial-gradient(circle at 40% 28%,#e1f6c7,#5ad02a 60%,#2a7a10);box-shadow:0 0 0 1px #000,0 0 8px rgba(129,232,114,.8)}
#bTal.has{animation:tpBtn 1.3s ease-in-out infinite}
@keyframes tpBtn{0%,100%{box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #8a6a2c,inset 0 2px 0 rgba(255,255,255,.12),0 0 0 rgba(245,224,154,0)}50%{box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px var(--gold-hi),inset 0 2px 0 rgba(255,255,255,.12),0 0 14px rgba(245,224,154,.75)}}

@media (min-width:600px){#bTal,#bBag{padding:0 10px}#bTal .hl,#bBag .hl{display:inline}}
/* relic flying from the field to the bag */
.lootfly{position:fixed;left:0;top:0;width:34px;height:34px;z-index:9;pointer-events:none;border-radius:4px;box-shadow:0 0 14px var(--rc,#fff);transition:transform .75s cubic-bezier(.5,-.3,.7,1),opacity .75s ease-in}
/* --- relic bag --- */
.ov.ov-bag{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.panel.bag{width:min(520px,calc(var(--vw-safe) - 16px));max-height:calc(var(--vh-safe) - 16px);display:flex;flex-direction:column;padding:10px 12px 12px;text-align:left;
  background:var(--noise),linear-gradient(#182527,#0b1212);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 3px #28676e,inset 0 0 0 4px #000,0 18px 50px rgba(0,0,0,.8)}

/* a unit's character sheet (gearpanel.js): the unit on its dais between its sockets, its stats, abilities and gear */

.panel.gearp{width:min(980px,calc(var(--vw-safe) - 16px));max-height:calc(var(--vh-safe) - 16px);display:flex;flex-direction:column;padding:10px 12px 12px;text-align:left;
  background:var(--noise),linear-gradient(#182527,#0b1212);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 3px #28676e,inset 0 0 0 4px #000,0 18px 50px rgba(0,0,0,.8)}

.gp-ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.seg button small{display:block;margin-top:3px;font:700 11px/1 var(--f-ui);letter-spacing:.03em}
.seg button[aria-pressed="true"]{color:var(--gold-hi);background:linear-gradient(#1f3436,#111d1e);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px var(--gold),0 0 10px rgba(212,171,87,.3)}
.how{margin-top:14px;text-align:left;font-size:14px;line-height:1.4;color:var(--parch);background:rgba(0,0,0,.28);border-radius:4px;padding:8px 12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.how summary{cursor:pointer;font:400 15px var(--f-display);color:var(--gold-hi);letter-spacing:.04em}
.how ul{margin:8px 0 2px;padding-left:18px}
.how li{margin:5px 0}
.foot{margin:12px 0 0;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:6px 0 4px;padding:10px 14px;text-align:left;background:rgba(0,0,0,.3);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.stats dt{color:var(--muted)}
.stats dd{margin:0;font-weight:800;color:var(--gold-hi);font-variant-numeric:tabular-nums;text-align:right}

/* --- talents: a World of Warcraft (Wrath-era) talent frame. Stone panel with a brass rim, the tower's portrait in a
   gold ring at the top-left, a painted tree with square icons, green/gold/grey borders and rank counters, gold arrows,
   a navy tooltip, Talent Points along the bottom and tabs hanging beneath the frame. --- */
.tx{flex:none;width:36px;height:36px;padding:0;border:0;border-radius:4px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(#5a1a14,#2a0c08);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #b8893a,inset 0 2px 0 rgba(255,255,255,.15)}
.tx svg{width:15px;height:15px}
.tx:active{filter:brightness(1.3)}
/* ---------- Talent codex: an illustrated, gilded talent screen ----------
   header crest + school title, a strip of school emblems, the tree over its painting, a detail card and a footer */
.ov.ov-tal{padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));overflow:hidden;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.85))}
.panel.tal{--hue:#7aa8ff;--gl:#f2d27a;--gm:#c9973c;--gd:#174a50;position:relative;width:min(1080px,calc(var(--vw-safe) - 12px));height:min(780px,calc(var(--vh-safe) - 12px));min-width:0;padding:0;display:flex;text-align:left;background:none;box-shadow:none;border:0}
.tc{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:10px;padding:10px 12px 8px;color:#e9dfc8;
  background:radial-gradient(ellipse at 50% -10%,var(--hue-18t),transparent 60%),var(--noise),linear-gradient(#141b1c,#0a0d0e 60%,#070a0a);
  box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px var(--gd),inset 0 0 0 3px var(--gl),inset 0 0 0 4px var(--gm),inset 0 0 0 6px #070f10,inset 0 0 0 7px #20595f,inset 0 0 40px rgba(0,0,0,.8),0 0 0 1px #000,0 20px 60px rgba(0,0,0,.9)}
.tc-cn{position:absolute;width:46px;height:46px;pointer-events:none;z-index:7;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 46'%3E%3Cg fill='none' stroke-linecap='round'%3E%3Cpath d='M3 43V15Q3 3 15 3h28' stroke='%23000' stroke-width='5'/%3E%3Cpath d='M3 43V15Q3 3 15 3h28' stroke='%23f2d27a' stroke-width='2.4'/%3E%3Cpath d='M9 37V18q0-9 9-9h19' stroke='%238a6424' stroke-width='1.4'/%3E%3Cpath d='M3 24q9 1 11-7t13-9' stroke='%23c9973c' stroke-width='1.6'/%3E%3C/g%3E%3Ccircle cx='15' cy='15' r='4.2' fill='%23120d07' stroke='%23f2d27a' stroke-width='1.6'/%3E%3Ccircle cx='15' cy='15' r='1.8' fill='%23ffe9a8'/%3E%3C/svg%3E") center/contain no-repeat}
.tc-cn.a{left:0;top:0}.tc-cn.b{right:0;top:0;transform:scaleX(-1)}.tc-cn.c{left:0;bottom:0;transform:scaleY(-1)}.tc-cn.d{right:0;bottom:0;transform:scale(-1,-1)}
/* header: tower crest, title in the school's colour between gilded rules, close */
.tc-hd{flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:2px 46px 6px 4px;min-height:58px}
.tc-crest{flex:none;width:58px;height:58px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--gl),var(--gd),var(--gm),var(--gl),var(--gd),var(--gl));box-shadow:0 0 0 1px #000,0 0 16px var(--hue-45t),0 3px 8px rgba(0,0,0,.8)}
.tc-crest canvas{width:100%;height:100%;display:block;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--hue-40k),#030405);box-shadow:inset 0 0 0 2px #000}
.tc-ttl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.tc-ttl small{font:400 11px/1 var(--f-display);letter-spacing:.32em;color:var(--gm);text-transform:uppercase}
.tc-ttl h2{margin:2px 0 1px;display:flex;align-items:center;gap:12px;width:100%;justify-content:center;font:400 30px/1.05 var(--f-display);letter-spacing:.08em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 10%,var(--hue-55w) 45%,var(--hue) 70%,var(--hue-50k));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 10px var(--hue-45t))}
.tc-ttl h2::before,.tc-ttl h2::after{content:"";flex:1;max-width:160px;height:2px;background:linear-gradient(90deg,transparent,var(--gm) 40%,var(--gl));box-shadow:0 1px 0 #000}
.tc-ttl h2::after{transform:scaleX(-1)}
.tc-ttl > span{font:600 12.5px/1.2 var(--f-ui);color:#93b2ae;letter-spacing:.02em}
.tc-ttl > span b{color:#faefcd}
.tc-x{position:absolute;right:2px;top:4px;width:36px;height:36px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
  background:radial-gradient(circle at 40% 30%,#c23a26,#6a120a 65%,#360604);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2.5px var(--gl),inset 0 0 0 3.5px #000,0 3px 6px rgba(0,0,0,.7)}
.tc-x svg{width:14px;height:14px}
.tc-x:active{filter:brightness(1.3)}
/* school emblems */
.tc-tabs{flex:none;display:flex;gap:6px;overflow-x:auto;overscroll-behavior:contain;scrollbar-width:none;padding:4px 6px 8px;margin:0 -4px 6px;justify-content:safe center;border-bottom:1px solid #000;box-shadow:0 1px 0 rgba(242,210,122,.18)}
.tc-tabs::-webkit-scrollbar{display:none}
.tc-tab{--th:#888;flex:none;position:relative;width:62px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:3px;color:#83a19d;font:700 10.5px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.tc-tab i{display:block;width:44px;height:44px;border-radius:8px;padding:2px;background:linear-gradient(145deg,#738b8d,#30393a 45%,#121919 60%,#57696b);box-shadow:0 0 0 1px #000,0 3px 6px rgba(0,0,0,.7);transition:transform .15s}
.tc-tab i img,.tc-tab i canvas{width:100%;height:100%;display:block;border-radius:6px;object-fit:cover;filter:saturate(.55) brightness(.62);box-shadow:inset 0 0 0 1px #000}
.tc-tab em{position:absolute;right:4px;top:-3px;min-width:17px;padding:2px 3px;border-radius:9px;font:800 10.5px/1 var(--f-ui);font-style:normal;text-align:center;color:#061516;background:linear-gradient(#f6e5b1,#c9973c);box-shadow:0 0 0 1px #000}
.tc-tab em:empty{display:none}
.tc-tab:hover i img,.tc-tab:hover i canvas{filter:none}
.tc-tab.on{color:var(--gl)}
.tc-tab.on i{transform:translateY(-2px);background:linear-gradient(145deg,#f8edbf,var(--gm) 30%,var(--gd) 55%,var(--gl));box-shadow:0 0 0 1px #000,0 0 14px var(--th-70t),0 4px 8px rgba(0,0,0,.7)}
.tc-tab.on i img,.tc-tab.on i canvas{filter:none}
.tc-tab.on::after{content:"";position:absolute;left:50%;bottom:-9px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--gl);box-shadow:0 0 0 1px #000,0 0 8px var(--th)}
/* body: tree on the left, detail card on the right */
.tc-main{flex:1 1 auto;min-height:0;display:flex;gap:10px}
.tc-tree{position:relative;flex:1.35 1 0;min-width:0;min-height:0;overflow:hidden;border-radius:6px;background:#030405;box-shadow:0 0 0 1px #000,0 0 0 3px #143134,0 0 0 4px var(--gm),0 0 0 5px #000}
.tc-bg{position:absolute;inset:0;background-size:cover;background-position:center 35%;filter:saturate(.9) brightness(.62)}
.tc-tree::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.15),rgba(0,0,0,.7) 75%),linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,.5))}
.tc-links{position:absolute;left:0;top:0;z-index:2;pointer-events:none;overflow:visible}
.tc-links .lk{fill:none;stroke-linecap:round}
.tc-links .lk.o{stroke:#000;stroke-width:8}
.tc-links .lk.f{stroke:#9a8452;stroke-width:4}
.tc-links .lit .lk.f{stroke:var(--gl);filter:drop-shadow(0 0 3px var(--hue))}
.tc-links .hd{fill:#9a8452;stroke:#000;stroke-width:1.8}
.tc-links .lit .hd{fill:var(--gl)}
.tc-grid{--n:56px;position:absolute;inset:0;z-index:3;display:grid;grid-template-columns:var(--n) 30px var(--n);grid-template-rows:repeat(5,var(--n));column-gap:20px;row-gap:22px;justify-content:center;align-content:center;padding:8px 8px 14px 34px}
.tor{grid-column:2;align-self:center;justify-self:center;font:400 13px/1 var(--f-display);letter-spacing:.06em;color:#c9b27a;opacity:.75;text-shadow:0 1px 2px #000,0 0 6px #000;pointer-events:none}
/* a node of the Paths page: painted icon in a gilded frame with a gem on top and a plaque below (a talent tree's nodes restyle it: <wowtree>) */
.tn{--fr:linear-gradient(145deg,#f8edbf,#c9973c 28%,#174a50 52%,#e2b860 76%,#1d585f);position:relative;width:var(--n);height:var(--n);padding:3px;border:0;border-radius:7px;cursor:pointer;touch-action:manipulation;background:var(--fr);
  box-shadow:0 0 0 1px #000,0 4px 10px rgba(0,0,0,.85)}
.tn img{width:100%;height:100%;display:block;border-radius:4px;pointer-events:none;box-shadow:inset 0 0 0 1px #000;background:#000;transition:filter .2s}
.tn::before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#51736e,#182527);box-shadow:0 0 0 1.5px #000;z-index:2}
.tn::after{content:"";position:absolute;inset:-5px;border-radius:10px;pointer-events:none;opacity:0;box-shadow:0 0 0 2px #faf3d5,0 0 14px 2px var(--hue-80w);transition:opacity .15s}
.tn .tr{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:3;min-width:30px;max-width:calc(var(--n) + 42px);overflow:hidden;text-overflow:ellipsis;padding:2px 5px 2px;border-radius:5px;font:800 10.5px/1 var(--f-ui);text-align:center;white-space:nowrap;color:#7b9591;
  background:linear-gradient(#1a2527,#080c0c);box-shadow:0 0 0 1px #000,inset 0 0 0 1px #2b4e52}
.tn .lock{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
.tn .lock svg{width:38%;height:38%;opacity:.85;filter:drop-shadow(0 1px 2px #000)}
.tn.locked,.tn.req{--fr:linear-gradient(145deg,#7c9294,#404d4e 35%,#1a1f1f 55%,#5c6f70 80%,#242b2c)}
.tn.locked img,.tn.req img{filter:grayscale(1) brightness(.36) contrast(.9)}
.tn.req img{filter:grayscale(.85) brightness(.5)}
.tn.open{--fr:linear-gradient(145deg,#c8b07a,#28676e 35%,#123134 55%,#a8884a 80%,#173e42)}
.tn.open img{filter:saturate(.8) brightness(.78)}
.tn.open .tr{color:#d8c89a}
.tn.avail::before,.tn.partial::before{background:linear-gradient(135deg,#fff,var(--hue));box-shadow:0 0 0 1.5px #000,0 0 6px var(--hue)}
.tn.avail{animation:tnGlow 1.8s ease-in-out infinite}
.tn.avail .tr,.tn.partial.avail .tr{color:#9be872;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #3a8a2a}
.tn.partial .tr{color:#f3da96;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #8a6a2a}
.tn.maxed{--fr:linear-gradient(145deg,#fcf9e3,#efcf70 25%,#a8761c 50%,#f6eab1 72%,#b8861e);box-shadow:0 0 0 1px #000,0 0 12px var(--hue-60t),0 4px 10px rgba(0,0,0,.85)}
.tn.maxed::before{background:linear-gradient(135deg,#fff,#efcf70);box-shadow:0 0 0 1.5px #000,0 0 8px #efcf70}
.tn.maxed .tr{color:#0a1f22;background:linear-gradient(#f6eab1,#d8a83a);box-shadow:0 0 0 1px #000}
@keyframes tnGlow{0%,100%{box-shadow:0 0 0 1px #000,0 0 6px var(--hue-50t),0 4px 10px rgba(0,0,0,.85)}50%{box-shadow:0 0 0 1px #000,0 0 16px 2px var(--hue-85t),0 4px 10px rgba(0,0,0,.85)}}
.tn:hover::after,.tn.sel::after{opacity:1}
.tn.sel{transform:scale(1.06);z-index:4}
.tn:focus-visible{outline:2px solid #fff;outline-offset:6px}
.tn.pop img{animation:tnPop .6s ease-out}
.tn.pop::after{animation:tnRing .6s ease-out}
@keyframes tnPop{0%{filter:brightness(2.4) saturate(1.4)}100%{filter:none}}
@keyframes tnRing{0%{opacity:1;inset:-2px}100%{opacity:0;inset:-18px}}
/* the detail card */
.tc-det{position:relative;flex:1 1 0;min-width:0;max-width:390px;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:6px;
  background:var(--noise),linear-gradient(#13191a,#090d0d);box-shadow:0 0 0 1px #000,0 0 0 3px #143134,0 0 0 4px var(--gm),0 0 0 5px #000}
.td-art{flex:0 0 auto;position:relative;height:38%;min-height:90px;background-size:cover;background-position:center 30%}
.td-art::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 45%,#0e1313 98%)}
.tc-det.pick .td-art{height:22%;min-height:56px}
.td-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 12px;margin-top:-26px;position:relative;z-index:1}
.td-body h3{margin:0;font:400 21px/1.15 var(--f-display);letter-spacing:.04em;color:#f6e5b1;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.9)}
.td-fl{margin:4px 0 0;font:600 13.5px/1.35 var(--f-ui);color:#d8ccb0}
.td-q{margin:8px 0 0;padding-left:10px;border-left:2px solid var(--gm);font:italic 500 13px/1.35 var(--f-ui);color:#81a19d}
.td-prog{margin:12px 0 0;font:700 12px/1 var(--f-ui);color:#93b2ae;display:flex;flex-direction:column;gap:6px}
.td-prog b{color:#faefcd}
.td-bar{height:8px;border-radius:5px;background:#060909;box-shadow:inset 0 0 0 1px #000,0 0 0 1px #1c3f43;overflow:hidden}
.td-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hue-60k),var(--hue),#fff);box-shadow:0 0 8px var(--hue)}
.td-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.td-chips span{display:flex;align-items:center;gap:5px;padding:2px 7px 2px 2px;border-radius:12px;font:700 11.5px/1 var(--f-ui);color:#f3da96;background:rgba(239,207,112,.07);box-shadow:inset 0 0 0 1px rgba(239,207,112,.3)}
.td-chips img{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1px #000}
.td-hint{margin:10px 0 0;font:600 12.5px/1.3 var(--f-ui);color:#6b8581}
.td-head{display:flex;align-items:center;gap:12px}
.td-ic{flex:none;width:68px;height:68px;padding:3px;border-radius:9px;background:linear-gradient(145deg,#f8edbf,#c9973c 28%,#174a50 52%,#e2b860 76%,#1d585f);box-shadow:0 0 0 1px #000,0 0 14px var(--hue-45t),0 4px 10px rgba(0,0,0,.8)}
.td-ic img{width:100%;height:100%;display:block;border-radius:6px}
.td-ic.dim img{filter:grayscale(1) brightness(.45)}
.td-rank{display:flex;align-items:center;gap:6px;margin-top:5px;font:700 12px/1 var(--f-ui);color:#93b2ae;letter-spacing:.04em;text-transform:uppercase}
.td-pips{display:flex;gap:3px}
.td-pips i{width:9px;height:9px;transform:rotate(45deg);background:#0e1718;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #2b4e52}
.td-pips i.on{background:linear-gradient(135deg,#fff,var(--hue));box-shadow:0 0 0 1px #000,0 0 5px var(--hue)}
.td-kind{margin-top:4px;font:600 11.5px/1 var(--f-ui);color:#6b8581}
.td-sec{margin-top:11px;padding:8px 10px;border-radius:5px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(242,210,122,.14)}
.td-sec h5{margin:0 0 4px;font:400 11px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--gm)}
.td-sec p{margin:0;font:600 13.5px/1.35 var(--f-ui);color:#f3e6c4}
.td-sec p.td-con{margin-top:4px;color:#ff8f74;font-weight:600}
.td-sec.nx p:first-of-type{color:#c0e2a6}
.td-bad{margin:8px 0 0;font:700 12.5px/1.3 var(--f-ui);color:#ff6a5a}
.td-done{margin-top:12px;padding:8px;border-radius:5px;text-align:center;font:400 14px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#0a1f22;background:linear-gradient(#f6eab1,#d8a83a);box-shadow:0 0 0 1px #000,0 0 12px rgba(239,207,112,.4)}
.td-wait{margin:12px 0 0;font:600 12.5px/1.3 var(--f-ui);color:#7b9591}
/* buttons */
.tc-btn{border:0;cursor:pointer;touch-action:manipulation;border-radius:6px;font:400 14px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:#faf2d5;text-shadow:0 1px 0 #000}
.tc-btn.learn{position:sticky;bottom:0;z-index:2;display:block;width:100%;margin-top:12px;min-height:42px;background:linear-gradient(#4aa83a,#1f6a14 55%,#124a0a);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2.5px var(--gl),inset 0 0 0 3.5px #000,inset 0 6px 0 rgba(255,255,255,.12),0 0 14px rgba(125,230,101,.25)}
.tc-btn.learn:active{filter:brightness(1.25)}
.tc-btn.reset{flex:none;min-height:32px;padding:6px 14px;font-size:12px;background:linear-gradient(#8a2418,#4a0c06);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #b8955a,inset 0 0 0 3px #000}
.tc-btn.open{flex:none;min-height:32px;padding:6px 14px;font-size:12px;background:linear-gradient(#3a9a7e,#145a48);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #b8955a,inset 0 0 0 3px #000}
.tc-btn.open small{font-size:10px;opacity:.85}
.tc-btn.open:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
.tc-tab.shut i{filter:grayscale(.85) brightness(.55)}
.tc-tab.shut b{opacity:.55}
.tc-tab.shut::before{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;z-index:2;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9V6.5a4 4 0 0 1 8 0V9' fill='none' stroke='%23d9c387' stroke-width='2.6'/%3E%3Crect x='4' y='9' width='12' height='9' rx='1.5' fill='%23d9c387'/%3E%3C/svg%3E") center/contain no-repeat}
.tc-btn.reset small{font:700 11px/1 var(--f-ui);letter-spacing:0;color:#f3da96;text-transform:none}
.tc-btn.reset:disabled{cursor:default;color:#667a7c;background:linear-gradient(#313b3b,#191e1f);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #4c5b5c,inset 0 0 0 3px #000}
.tc-btn.reset:disabled small{color:#667a7c}
/* footer: talent points, hint, reset */
.tc-ft{flex:none;display:flex;align-items:center;gap:12px;padding:8px 6px 2px}
.tc-pts{display:flex;align-items:center;gap:8px;font:400 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--gm)}
.tc-pts i{width:26px;height:26px;transform:rotate(45deg);border-radius:4px;display:grid;place-items:center;background:linear-gradient(135deg,#203335,#081010);box-shadow:0 0 0 1px #000,inset 0 0 0 2px #3b5d61}

/* talents: capstone choice and plan */
.tn .rk{position:absolute;right:-8px;bottom:10px;z-index:4;min-width:24px;padding:3px 4px 2px;border-radius:4px;font:800 11px/1 var(--f-ui);text-align:center;letter-spacing:.02em;color:#8a9896;background:#070b0b;box-shadow:0 0 0 1.5px #000,inset 0 0 0 1px #34403f}

.tn.locked .rk,.tn.excl .rk,.tn.req .rk{opacity:.55}
.tn.avail:not(.has) img,.tn.open:not(.has) img{filter:saturate(.45) brightness(.62)}

.tn.has img{filter:none}

.tn.excl img{filter:grayscale(1) brightness(.3)}

.tn.plan .pl{display:block}

/* <wowtree> Talent trees as World of Warcraft Classic lays them out (ui.js buildTree; owner, 10 Nov 2026): small square
   icons in thin bevelled frames, the rank in the corner, straight arrows, the tree's painting dimmed behind. The grid
   shows state only: greyscale = locked, a gold frame = can be learned now, green = full. A spell talent's art sits in a
   round inner frame. Scoped to .tc-tree.wow, so the Paths page keeps the older node (.tn above). */
.tc-tree.wow .tc-bg{background-position:center 35%;filter:saturate(.8) brightness(.42)}
.tc-tree.wow.art .tc-bg{background-position:center;filter:saturate(.92) brightness(.56)}
.tc-tree.wow::before{background:radial-gradient(ellipse 30% 62% at 50% 50%,rgba(0,0,0,.38),rgba(0,0,0,0)),linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 78%,rgba(0,0,0,.38))}
.tc-tree.wow .tc-grid{padding:8px 8px 14px}
.tc-tree.wow .tn{--fr:linear-gradient(145deg,#d2cab2,#8f8873 32%,#4b483e 64%,#2b2924);padding:3px;border-radius:3px;background:linear-gradient(#0d0f10,#0d0f10) content-box,var(--fr);box-shadow:0 0 0 1px #000,0 2px 6px rgba(0,0,0,.85);animation:none}
.tc-tree.wow .tn::before{display:none}
.tc-tree.wow .tn::after{inset:-3px;border-radius:5px;box-shadow:0 0 0 1px rgba(255,255,255,.9),0 0 8px rgba(255,255,255,.4)}
.tc-tree.wow .tn:focus-visible{outline-offset:4px}
.tc-tree.wow .tn img{border-radius:0;box-shadow:none;outline:1px solid #000;filter:none;transition:none}
.tc-tree.wow .tn.open img{filter:saturate(.75) brightness(.82)}
.tc-tree.wow .tn.has img{filter:none}
.tc-tree.wow .tn.locked,.tc-tree.wow .tn.req,.tc-tree.wow .tn.excl{--fr:linear-gradient(145deg,#7d7a70,#4d4b44 40%,#232220)}
.tc-tree.wow .tn.locked img,.tc-tree.wow .tn.req img{filter:grayscale(1) brightness(.6) contrast(.92)}
.tc-tree.wow .tn.excl img{filter:grayscale(1) brightness(.34)}
/* learnable: full colour in the plain frame; yellow is kept for talents with a point in them (owner, 10 Nov 2026) */
.tc-tree.wow .tn.avail{animation:none}
.tc-tree.wow .tn.avail img{filter:none}
/* a talent with a point in it wears a yellow outline outside its frame, whatever the frame says (gold: learnable, green: full) */
.tc-tree.wow .tn.has{box-shadow:0 0 0 1px #000,0 0 0 3px #ffec96,0 0 0 4px #000,0 2px 6px rgba(0,0,0,.85)}
/* full: the same outline, a little towards orange (owner: no separate green frame) */
.tc-tree.wow .tn.has.maxed{box-shadow:0 0 0 1px #000,0 0 0 3px #ffd22e,0 0 0 4px #000,0 2px 6px rgba(0,0,0,.85)}
.tc-tree.wow .tn.has::after{inset:-6px;border-radius:7px}
.tc-tree.wow .tn.spell img{width:calc(100% - 6px);height:calc(100% - 6px);margin:3px;border-radius:50%;outline:0;box-shadow:0 0 0 1px #000,0 0 0 2px #cdb47a,0 0 0 3px #000}
.tc-tree.wow .tn.spell.locked img,.tc-tree.wow .tn.spell.req img,.tc-tree.wow .tn.spell.excl img{box-shadow:0 0 0 1px #000,0 0 0 2px #6f6c62,0 0 0 3px #000}
.tc-tree.wow .tn .rk{right:-6px;bottom:-6px;min-width:0;padding:2px 3px 1px;border-radius:2px;font:800 10.5px/1 var(--f-ui);letter-spacing:0;color:#c4c2ba;background:#08090a;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #45433c;opacity:1}
.tc-tree.wow .tn.locked .rk,.tc-tree.wow .tn.req .rk,.tc-tree.wow .tn.excl .rk{color:#7b7a74;opacity:1}
.tc-tree.wow .tn.has .rk{color:#ffec96;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #8a7a3a}
.tc-tree.wow .tn.avail:not(.has) .rk{color:#fff}
.tc-tree.wow .tn.maxed .rk{color:#ffd22e;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #8a6a12}
.tc-tree.wow .tn .pl{left:-4px;top:-4px;bottom:auto;width:9px;height:9px;box-shadow:0 0 0 1px #000,0 0 5px #7ad0ff}
.tc-tree.wow .tc-grid.tight{padding:4px 8px 6px}
.tc-tree.wow .tc-grid.tight .tn{padding:2px}
.tc-tree.wow .tc-grid.tight .tn .rk{right:-5px;bottom:-5px;font-size:9px;padding:1px 2px}
.tc-tree.wow .tc-grid.tight .tn.spell img{width:calc(100% - 4px);height:calc(100% - 4px);margin:2px;box-shadow:0 0 0 1px #cdb47a,0 0 0 2px #000}
.tc-tree.wow .tc-links .lk.o{stroke-width:6.5;stroke-linecap:butt}
.tc-tree.wow .tc-links .lk.f{stroke:#8d8978;stroke-width:3.5;stroke-linecap:butt}
.tc-tree.wow .tc-links .lit .lk.f{stroke:#f4cf3c;filter:none}
.tc-tree.wow .tc-links .hd{fill:#8d8978;stroke:#000;stroke-width:1.5;stroke-linejoin:round}
.tc-tree.wow .tc-links .lit .hd{fill:#f4cf3c}

.es-grid div{padding:9px 4px 7px;border-radius:5px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(242,210,122,.14);text-align:center}
.es-grid b{display:block;font:400 22px/1.1 var(--f-display);color:var(--gold-hi)}
.es-grid small{font-size:11px;color:var(--muted)}
.es-tips{margin:8px 0 10px;padding:10px 12px;border-radius:6px;text-align:left;background:rgba(18,40,22,.5);box-shadow:inset 0 0 0 1px rgba(150,230,120,.28)}
.es-tips h4{color:#9be872}.es-tips h4.kn{margin-top:8px;color:#8fd0ff}
.es-tips ul{margin:0;padding-left:18px}.es-tips li{margin:3px 0;font-size:13.5px;line-height:1.35;color:#e8f4ff}

.es-build{margin:8px 0 6px;padding:10px 12px;border-radius:6px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(242,210,122,.2);text-align:center}
.es-build > small{display:block;font:700 11px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.es-build > b{display:block;margin:4px 0 2px;font:400 26px/1.05 var(--f-display);color:var(--gold-hi);letter-spacing:.05em}

  background:linear-gradient(#172527,#0b1213);box-shadow:0 0 0 1px #000,inset 0 0 0 1px rgba(242,210,122,.45),0 8px 20px rgba(0,0,0,.7)}
#tipBox[hidden]{display:none}
.tipd{cursor:help;outline:none}
.tipd:focus-visible{box-shadow:0 0 0 2px var(--gold-hi)}
.es-hint{margin:2px 0 6px;font-size:11.5px;color:var(--muted);opacity:.8}

.bg-cell.nofit{opacity:.38;filter:saturate(.5)}.bg-cell.att::after{content:'';position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%;background:#7ad8ff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6)}.bg-fit{margin:-2px 0 6px;font-size:12px;color:#8fd8ff}.bg-fit.no{color:#f2a187}

/* ================= Ravenswood Keep: the look, taken from the logo =================
   Teal-black night, parchment gold with dark teal edges, turquoise gems and glow, a few green leaves.
   Panels are dark teal glass in a fine gold frame with a crowning gem; headings are carved parchment gold;
   the main button is a gold plate, the rest dark teal with a gold hairline; highlights glow turquoise. */
:root{
  --rk-ink:#050c0d; --rk-deep:#081618; --rk-panel:#0d2124; --rk-panel2:#071315; --rk-line:#173a3e;
  --rk-gold:#e2c27e; --rk-gold-hi:#f8e7b8; --rk-gold-lo:#9a7438; --rk-bronze:#5e4520;
  --rk-teal:#3fe0d6; --rk-teal-mid:#1fa9a8; --rk-teal-deep:#0b4a4e; --rk-leaf:#7fae4a;
  --gold:#e2c27e; --gold-hi:#f8e7b8; --parch:#efe2c4; --muted:#8eaaa6; --good:#9fd47a; --ink:#050c0d;
  --rk-gem:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 64'%3E%3Cdefs%3E%3ClinearGradient id='f' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23fff6d6'/%3E%3Cstop offset='.45' stop-color='%23d9b26a'/%3E%3Cstop offset='1' stop-color='%236b4a1e'/%3E%3C/linearGradient%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23d8fffb'/%3E%3Cstop offset='.35' stop-color='%2346e3d8'/%3E%3Cstop offset='1' stop-color='%230a5a5c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M20 1 C22 18 30 28 39 32 C30 36 22 46 20 63 C18 46 10 36 1 32 C10 28 18 18 20 1Z' fill='url(%23f)' stroke='%23071a1c' stroke-width='1.6'/%3E%3Cpath d='M20 12 C21.5 22 26 28 31 32 C26 36 21.5 42 20 52 C18.5 42 14 36 9 32 C14 28 18.5 22 20 12Z' fill='url(%23g)'/%3E%3Cpath d='M20 12 C21.5 22 26 28 31 32 L20 32Z' fill='%23ffffff' opacity='.35'/%3E%3C/svg%3E");
  --rk-rule:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 20'%3E%3Cdefs%3E%3ClinearGradient id='l' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23e2c27e' stop-opacity='0'/%3E%3Cstop offset='.4' stop-color='%23e2c27e'/%3E%3Cstop offset='.6' stop-color='%23e2c27e'/%3E%3Cstop offset='1' stop-color='%23e2c27e' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='6' y='9.3' width='228' height='1.4' fill='url(%23l)'/%3E%3Cpath d='M92 10 C100 4 106 5 110 9 C104 8 99 9 92 10Z M148 10 C140 4 134 5 130 9 C136 8 141 9 148 10Z' fill='%237fae4a'/%3E%3Cpath d='M120 1 L126 10 L120 19 L114 10Z' fill='%23e2c27e' stroke='%23071a1c' stroke-width='.8'/%3E%3Cpath d='M120 4.5 L123.5 10 L120 15.5 L116.5 10Z' fill='%233fe0d6'/%3E%3C/svg%3E");
  --rk-spark:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M10 0 C10.8 7 13 9.2 20 10 C13 10.8 10.8 13 10 20 C9.2 13 7 10.8 0 10 C7 9.2 9.2 7 10 0Z' fill='%23b8fff8'/%3E%3C/svg%3E");
  --trim:linear-gradient(90deg,#0b4a4e,#9a7438 12%,#f8e7b8 30%,#e2c27e 50%,#f8e7b8 70%,#9a7438 88%,#0b4a4e);
}
html,body{background:var(--rk-ink)}
/* overlays and panels */
.ov{background:radial-gradient(ellipse at 50% 38%,rgba(10,42,46,.5),rgba(3,9,10,.92) 72%)}
.panel{position:relative;border-radius:10px;
  background:var(--noise),radial-gradient(ellipse at 50% 0%,rgba(63,224,214,.10),rgba(63,224,214,0) 60%),linear-gradient(180deg,var(--rk-panel),var(--rk-panel2));
  box-shadow:0 0 0 1px #02090a,0 0 0 2px var(--rk-gold-lo),0 0 0 3px #f2d798,0 0 0 4px var(--rk-gold-lo),0 0 0 5px #02090a,0 0 26px rgba(63,224,214,.16),0 24px 60px rgba(0,0,0,.85),inset 0 0 0 1px rgba(63,224,214,.12),inset 0 0 40px rgba(31,169,168,.07)}
.panel::before{content:'';position:absolute;left:50%;top:-15px;width:20px;height:32px;margin-left:-10px;background:var(--rk-gem) center/contain no-repeat;filter:drop-shadow(0 0 6px rgba(63,224,214,.7)) drop-shadow(0 2px 2px #000);pointer-events:none;z-index:1}
.panel.tal::before,.panel.bag::before,.panel.title::before,.panel.war::before,.panel.wr::before{display:none}
/* headings: carved parchment gold, edged in dark teal, with a turquoise breath of light */
.ttl{font:700 clamp(28px,8.4vw,40px)/1.08 var(--f-deco);letter-spacing:.02em;color:var(--rk-gold-hi);text-shadow:none;
  background:linear-gradient(180deg,#fff6d8 0%,#f0d79a 36%,#c99a52 58%,#e9cd8c 78%,#fff0c8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 #04191b) drop-shadow(0 0 1px #04191b) drop-shadow(0 0 10px rgba(63,224,214,.32))}
.ttl::after{content:'';display:block;width:min(220px,70%);height:16px;margin:4px auto 0;background:var(--rk-rule) center/contain no-repeat;-webkit-text-fill-color:initial}
.ttl.lose{background:linear-gradient(180deg,#ffd9cc,#e07a64 60%,#ffb4a0);-webkit-background-clip:text;background-clip:text}
.sub{color:#86b2ad;letter-spacing:.16em}
/* buttons: the gold plate, and dark teal with a gold hairline */
.btn{border-radius:6px;font:700 18px/1.1 var(--f-display);letter-spacing:.07em;color:#082326;text-shadow:0 1px 0 rgba(255,246,214,.55);
  background:linear-gradient(180deg,#fff2c9 0%,#ecd093 30%,#d2a75e 62%,#b98a46 100%);
  box-shadow:inset 0 0 0 1px #4a3214,inset 0 2px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(70,40,10,.35),0 0 0 1px #02090a,0 3px 0 #02090a,0 0 18px rgba(63,224,214,.18);transition:box-shadow .15s,filter .15s}
.btn small{color:#173c3f;opacity:.85;text-shadow:none}
.btn:hover{box-shadow:inset 0 0 0 1px #4a3214,inset 0 2px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(70,40,10,.35),0 0 0 1px #02090a,0 3px 0 #02090a,0 0 22px rgba(63,224,214,.5)}
.btn.ghost{color:var(--rk-gold-hi);text-shadow:0 1px 0 #000;background:linear-gradient(180deg,#14363a,#0a1f22);
  box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px rgba(201,160,90,.75),inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #02090a}
.btn.ghost small{color:#9cc2bd}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px var(--rk-gold),inset 0 0 14px rgba(63,224,214,.25),0 2px 0 #02090a,0 0 14px rgba(63,224,214,.35)}
.btn.danger{color:#fff;text-shadow:0 1px 0 #000;background:linear-gradient(180deg,#8a2a1e,#4a0f0a);box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px #c9805a,0 2px 0 #02090a}
.seg button{border-radius:6px;color:#8eaaa6;background:linear-gradient(180deg,#0f2427,#091719);box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px #1d4246}
.seg button[aria-pressed="true"]{color:var(--rk-gold-hi);background:linear-gradient(180deg,#14393d,#0b2124);box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px var(--rk-gold),inset 0 0 12px rgba(63,224,214,.22),0 0 12px rgba(63,224,214,.3)}
.how{border-radius:6px;background:rgba(2,12,13,.45);box-shadow:inset 0 0 0 1px rgba(63,224,214,.14)}
.how summary,.chal summary{color:var(--rk-gold-hi)}
.how summary::marker{color:var(--rk-teal)}
.stats{border-radius:6px;background:rgba(2,12,13,.5);box-shadow:inset 0 0 0 1px rgba(63,224,214,.14)}
.stats dd{color:var(--rk-gold-hi)}
.tx{border-radius:50%;background:radial-gradient(circle at 50% 35%,#1d4a4e,#0a2023 70%);box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px var(--rk-gold),0 0 10px rgba(63,224,214,.3)}
.tx svg{color:var(--rk-gold-hi)}
/* the title: the logo itself, floating over the battlefield, with the options beneath */
.ov.ov-title{background:radial-gradient(ellipse at 50% 30%,rgba(8,30,33,.15),rgba(3,9,10,.82) 75%)}
.panel.title{width:min(440px,100%);padding:0 18px 16px;background:none;box-shadow:none}
.title .logo{display:block;margin:-6px auto 0;width:min(100%,420px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.85)) drop-shadow(0 0 18px rgba(63,224,214,.18));animation:rkFloat 6s ease-in-out infinite}
.title .logo-wrap{position:relative;margin:0;font-size:inherit;line-height:0}
.title .logo-wrap i{position:absolute;width:14px;height:14px;background:var(--rk-spark) center/contain no-repeat;filter:drop-shadow(0 0 6px #3fe0d6);opacity:0;animation:rkTwinkle 3.6s ease-in-out infinite}
.title .logo-wrap i:nth-child(2){left:6%;top:30%;animation-delay:.4s}
.title .logo-wrap i:nth-child(3){right:7%;top:22%;width:10px;height:10px;animation-delay:1.3s}
.title .logo-wrap i:nth-child(4){left:16%;bottom:12%;width:9px;height:9px;animation-delay:2.1s}
.title .logo-wrap i:nth-child(5){right:15%;bottom:18%;animation-delay:2.8s}
.title .logo-wrap i:nth-child(6){left:48%;top:-2%;width:11px;height:11px;animation-delay:1.8s}
.title .sub{margin:2px 0 10px;color:#9cc8c2;text-shadow:0 1px 2px #000}
.title .opts{padding:14px 14px 12px;border-radius:10px;background:var(--noise),linear-gradient(180deg,rgba(13,33,36,.92),rgba(7,19,21,.94));
  box-shadow:0 0 0 1px #02090a,0 0 0 2px var(--rk-gold-lo),0 0 0 3px #f2d798,0 0 0 4px var(--rk-gold-lo),0 0 0 5px #02090a,0 0 26px rgba(63,224,214,.14),0 18px 40px rgba(0,0,0,.7)}
.title .opts>.seg:first-child,.title .opts>.btn:first-child{margin-top:0}
.title .foot{color:#86a8a3;text-shadow:0 1px 2px #000}
/* top scores */
.lb{list-style:none;margin:12px 0 8px;padding:0;display:flex;flex-direction:column;gap:5px;text-align:left}
.lb-row{display:grid;grid-template-columns:26px 28px minmax(0,1fr) 84px 82px;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:7px;background:linear-gradient(180deg,rgba(19,44,47,.9),rgba(10,26,28,.92));box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px #1d4246}
.lb-row.me{box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px var(--rk-gold,#d4ab57)}
.lb-rk{font:700 15px/1 var(--f-ui);color:#9cc8c2;text-align:center}
.lb-row.top1 .lb-rk{color:#ffd76a}.lb-row.top2 .lb-rk{color:#d8e2e6}.lb-row.top3 .lb-rk{color:#e0a46a}
.lb-av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#0b1d1f}
.lb-who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 14px/1.15 var(--f-ui);color:#e8efe9}
.lb-who small{display:block;font:500 11px/1.3 var(--f-ui);color:#86a8a3;overflow:hidden;text-overflow:ellipsis}
.lb-w{font:700 14px/1 var(--f-ui);color:#ffd76a;white-space:nowrap;text-align:right}.lb-w i{font-style:normal;color:#ffe9a8}
.lb-rt{font:700 12px/1 'Cinzel',serif;color:#c9b6ff;white-space:nowrap;min-width:52px;text-align:center}.lb-rt small{display:block;margin-top:3px;font:700 10px/1 'Cinzel',serif;color:#9f8fd0}
.lb-note{padding:12px 6px;color:#9cc8c2;font-size:13px;text-align:center}
.lb-me{margin:6px 0 10px;font-size:13px;color:#cfe0dc}
.lb-me p{margin:4px 0}.lb-sm{color:#86a8a3;font-size:12px}
.lb-sig{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.lb-sig .lb-av{width:22px;height:22px}
.lb-nick{display:flex;gap:6px;margin-top:8px}
.lb-nick input{flex:1;min-width:0;padding:7px 9px;border-radius:6px;border:1px solid #1d4246;background:#081719;color:#e8efe9;font:500 13px var(--f-ui)}
.lb-nick .btn{width:auto;margin:0;padding:6px 12px;font-size:13px}
.lb-ini{display:grid;place-items:center;font:700 13px/1 var(--f-ui);color:#0b1d1f;background:linear-gradient(#e8c779,#b98a3c)}
.lb-discord{background:linear-gradient(#5865f2,#4752c4)!important;color:#fff!important}
.lb-link{margin-top:8px;border:0;background:none;color:#86a8a3;text-decoration:underline;cursor:pointer;font:500 12px var(--f-ui)}
.lb-end{margin:8px 0 6px;font:600 13px/1.4 var(--f-ui);color:#ffd76a;min-height:1em}
@keyframes rkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rkTwinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:1;transform:scale(1) rotate(20deg)}60%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.title .logo,.title .logo-wrap i{animation:none}.title .logo-wrap i{opacity:.8}}
/* the top bar and the console: teal-black stone with a gold rim */
#bar{background:var(--noise),linear-gradient(180deg,#123236,#0a1c1f 60%,#071517)}
#console{background:var(--noise),radial-gradient(ellipse at 50% 0%,rgba(63,224,214,.07),rgba(0,0,0,0) 60%),linear-gradient(180deg,#123236,#0b1e21 55%,#071416)}
.res{background:rgba(2,12,13,.55);border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),inset 0 0 0 2px rgba(63,224,214,.10)}
.hbtn{border-radius:5px;color:var(--rk-gold-hi);background:linear-gradient(180deg,#17393d,#0b2124);box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px rgba(201,160,90,.8),inset 0 2px 0 rgba(255,255,255,.08)}
.hbtn:hover{box-shadow:inset 0 0 0 1px #02090a,inset 0 0 0 2px var(--rk-gold),0 0 10px rgba(63,224,214,.4)}
#info{border-radius:6px;background:linear-gradient(180deg,#081a1c,#040d0e);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #1d4246,inset 0 2px 8px rgba(0,0,0,.8)}
#card{border-radius:6px;background:#040d0e;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #1d4246}
.cmd{border-radius:5px;background:#030a0b;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #24555a}
.cmd.on{box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px var(--rk-teal),0 0 12px rgba(63,224,214,.6)}
#infoBody h3{font:700 15px/1.15 var(--f-display);color:var(--rk-gold-hi);letter-spacing:.04em}

/* Main-menu layout and controls are defined in menus.css. */
/* Pause controls are styled in menus.css. */
/* the pages opened from the title keep its painting behind them */
.ov.ov-rites,.ov.ov-howp,.ov.ov-setp,.ov.ov-board,.ov.ov-savesp{background:linear-gradient(rgba(3,9,10,.74),rgba(3,9,10,.88)),var(--t2bg,none) center 40%/cover no-repeat}
.panel.howp{width:min(640px,100%);text-align:left}
.panel.howp .ttl,.panel.setp .ttl,.panel.rites .ttl{text-align:center}
.how-body{max-height:min(64vh,640px);overflow:auto;margin:6px 0 12px;padding-right:6px;font-size:14px;line-height:1.45}
.how-body ul{margin:0;padding-left:20px}.how-body li{margin:0 0 8px}
.panel.setp{width:min(460px,100%)}
.panel.savesp{--u:9px;width:min(460px,100%)}.panel.savesp .ttl{text-align:center}.sv-list{margin:6px 0 14px;text-align:left}
.panel.rites{width:min(600px,100%)}
.panel.rites .sub{text-transform:none;letter-spacing:0;font-size:13.5px;line-height:1.4}
.rt-list{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px;max-height:min(62vh,620px);overflow:auto;padding:2px}
.rt-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;text-align:left;cursor:pointer;color:#e8efe9;border-radius:6px;background:linear-gradient(180deg,rgba(19,44,47,.92),rgba(10,26,28,.94));border:1px solid rgba(201,151,60,.35);box-shadow:inset 0 0 0 1px #02090a}
.rt-row:hover:not(.locked){border-color:#f2d27a}
.rt-row.on{border-color:#f2d27a;background:linear-gradient(180deg,#1f4a40,#10302b);box-shadow:inset 0 0 0 1px #02090a,0 0 0 1px rgba(242,210,122,.35),0 0 14px rgba(242,210,122,.18)}
.rt-row.locked{cursor:default;opacity:.55;filter:saturate(.4)}
.rt-n{font:700 18px/1 'Cinzel',serif;color:#f2d27a;text-align:center}
.rt-t{min-width:0;display:flex;flex-direction:column;gap:3px}
.rt-t b{font:700 14px/1.15 'Cinzel',serif;color:#f2d27a;letter-spacing:.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rt-t small{font:500 13px/1.3 var(--f-ui);color:#c9d8d1}
.rt-map{font:600 11px/1 var(--f-ui);font-style:normal;color:#e8d79a;padding:2px 6px;border-radius:9px;background:rgba(242,210,122,.12);border:1px solid rgba(242,210,122,.3);letter-spacing:0}
.rt-map.night{color:#c9c2ff;background:rgba(150,140,255,.12);border-color:rgba(170,160,255,.35)}
.rt-b{font:700 12px/1.2 var(--f-ui);color:#ffd76a;white-space:nowrap;text-align:right}
.rite-open{margin:10px 0;padding:10px 12px;border-radius:7px;background:linear-gradient(180deg,rgba(60,48,110,.55),rgba(28,22,60,.6));border:1px solid rgba(190,170,255,.45);color:#e9e4ff;font-size:14px;line-height:1.4}
.rite-open b{display:block;font:700 16px/1.2 'Cinzel',serif;color:#d9ccff;margin-bottom:3px}
.hs-head .qk-line{order:9;flex-basis:100%;margin:2px 0 0;font-style:italic;color:#c9d8d1;font-size:13px}
.qk-ch{font:600 .55em/1 'Cinzel',serif;color:#c9d8d1;letter-spacing:.06em;margin-left:6px}
.qk-card{display:flex;flex-direction:column}.qk-card .sp-go{margin-top:auto}
.qk-rw{margin:8px 0 10px;padding:7px 9px;border-radius:6px;background:rgba(242,210,122,.07);border:1px solid rgba(242,210,122,.22);font-size:13px;line-height:1.35}
.qk-rw b{display:block;color:#f2d27a;margin-bottom:2px}

/* ---- the hero select: three tall banners, the chosen one under a sun in its colour ---- */

.hx{min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom))}
.hx-top{position:relative;width:min(760px,100%);text-align:center}

.hx-row{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1.28fr 1fr;gap:2.4%;align-items:end;touch-action:pan-y;user-select:none}
.hx-card{position:relative;min-width:0}
.hx-card.side{cursor:pointer;opacity:.8;filter:saturate(.7) brightness(.82);transition:opacity .15s,filter .15s}

.hx-card.main::before{content:'';position:absolute;z-index:0;left:50%;top:-13%;width:54%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;

  box-shadow:0 0 0 2px #e9c46a,0 0 34px rgba(255,214,120,.65);animation:hxSun 18s linear infinite}

.hx-banner{position:relative;z-index:1;display:flex;flex-direction:column;height:clamp(250px,52vh,600px);box-sizing:border-box;padding:7% 7% 8%;border-radius:3px 3px 2px 2px;

.hx-banner::before{content:'';position:absolute;left:50%;top:-9px;width:16px;height:16px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#ffe9a8,#b88a3a);border:1px solid #4a2e10}
.hx-portrait{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:2px;background:radial-gradient(ellipse at 50% 38%,rgba(255,255,255,.18),transparent 62%)}
.hx-portrait img{width:100%;height:100%;object-fit:cover}

.hx-none{font:700 54px/1 'Cinzel',serif;color:#c9d0d6;opacity:.7}
.hx-plate{margin-top:7%;text-align:center;padding:4% 4%;background:linear-gradient(#f9ebc6,#e2c68e);border:2px solid #a8752c;border-radius:3px;box-shadow:inset 0 0 0 1px #fff4d6,0 2px 5px rgba(0,0,0,.5);color:#3a2208;min-width:0}
.hx-plate b{display:block;font:700 clamp(12px,1.9vw,18px)/1.05 'Cinzel',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-plate small{display:block;margin-top:2px;font:600 clamp(8px,1.05vw,11px)/1.1 var(--f-ui);color:#6a4a20;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-bars{list-style:none;margin:7% 0 0;padding:0;display:flex;flex-direction:column;gap:clamp(2px,.5vh,5px)}
.hx-bars li{display:grid;grid-template-columns:clamp(12px,1.8vw,18px) minmax(0,1fr) auto;gap:clamp(3px,.6vw,6px);align-items:center;font:700 clamp(8px,1.05vw,11px)/1 var(--f-ui);color:#f3e4c4}
.hx-bars li.hx-flat{display:block;text-align:center;color:#b9b2a2;font-weight:600;padding:6px 0}
.hx-bars img{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1px rgba(242,210,122,.5)}
.hx-bar{position:relative;height:clamp(4px,.8vh,7px);border-radius:4px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(242,210,122,.22)}
.hx-bar::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(242,210,122,.55)}
.hx-bar i{position:absolute;top:0;bottom:0;width:calc(var(--v) * 50%);border-radius:3px}
.hx-bar.up i{left:50%;background:linear-gradient(90deg,#c9a24a,#ffe08a)}
.hx-bar.dn i{right:50%;background:linear-gradient(270deg,#a8402c,#e8765e)}
.hx-bars li em{font-style:normal;min-width:2.6em;text-align:right}.hx-bars li.up em{color:#ffe08a}.hx-bars li.dn em{color:#ff9e88}
.hx-icons{display:flex;justify-content:space-between;gap:5%;margin-top:8%}
.hx-ic{flex:1 1 0;max-width:46px;aspect-ratio:1;padding:0;border-radius:50%;overflow:hidden;cursor:pointer;border:2px solid #b2853a;background:radial-gradient(#3a2412,#160c06);box-shadow:0 2px 5px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,220,150,.25)}
.hx-ic img{width:100%;height:100%;display:block}
.hx-ic.on{border-color:#ffe08a;box-shadow:0 0 0 2px rgba(255,224,138,.45),0 0 14px rgba(255,214,120,.75)}
.hx-card.side .hx-ic{pointer-events:none}
.hx-arrow{flex:none;width:30px;height:44px;padding:0;border:0;cursor:pointer;background:linear-gradient(#fbecc4,#d8b46a);filter:drop-shadow(0 0 1px #5a3a12) drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.hx-arrow.l{clip-path:polygon(0 50%,45% 0,100% 0,100% 100%,45% 100%)}.hx-arrow.r{clip-path:polygon(100% 50%,55% 0,0 0,0 100%,55% 100%)}
.hx-arrow:hover{filter:brightness(1.1) drop-shadow(0 0 6px rgba(255,214,120,.7))}
.hx-info{width:min(640px,100%);box-sizing:border-box;padding:10px 14px;border-radius:8px;background:rgba(14,9,6,.8);border:1px solid rgba(242,210,122,.38);color:#f0e4c8;font-size:14px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.hx-info h4{margin:0;font:700 18px/1.1 'Cinzel',serif;color:color-mix(in srgb,var(--sc) 55%,#fff1c8)}.hx-info h4 small{font:600 13px var(--f-ui);color:#cdbf9f;margin-left:4px}
.hx-info p{margin:5px 0 0}.hx-info .hx-role{margin-top:2px;color:#cdbf9f;font-size:13px}.hx-info .hx-aff{font-size:12.5px;color:#d9ccaa}
.hx-info b{color:#f2d27a}.hx-info i{font-style:normal;color:#c9b88f;font-size:12px}
.hx-go{width:min(420px,94%);margin-top:2px;padding:13px 18px;font:700 18px/1.1 'Cinzel',serif;letter-spacing:.03em;color:#3a2208;cursor:pointer;background:linear-gradient(#fcedc6,#e0c389);border:3px solid #a8752c;border-radius:6px;box-shadow:inset 0 0 0 2px #fff4d6,0 0 0 2px #5a3a12,0 6px 16px rgba(0,0,0,.5)}
.hx-go b{color:#6a2a08}.hx-go:hover{filter:brightness(1.06)}
@media (max-width:520px){.hx-stage{gap:2px}.hx-arrow{width:22px;height:36px}.hx-banner{padding:8% 6% 9%}.hx-icons{gap:3%}.hx-info{font-size:13px}.hx-go{font-size:16px}}

/* the XP bar: a full-width strip along the top edge of the bottom console (force runs, xp.js); the level sits at its left */
#console{position:relative}
#rXp{position:absolute;left:0;right:0;top:-9px;height:9px;z-index:3;cursor:pointer;color:#cfeeff;display:flex;align-items:center}

#hXpF{display:block;height:100%;width:0;background:linear-gradient(#e2f6ff,#6cc2f2 50%,#2c6fa6);box-shadow:0 0 6px rgba(120,200,255,.75);transition:width .35s ease-out}
#rXp.up{animation:lvUp 1.5s ease-out}
#rXp.up #hLv{animation:lvNum 1.5s ease-out}

<script>
/* the loading screen reports how far start-up got, so a page that never finishes says where it stopped */
(function () {
  var t0 = Date.now(), stage = 'Loading the page', n = 0, p = 0;
  function el(id) { return document.getElementById(id); }
  window.__bootStage = stage;
  window.__bootBar = function (v) { if (v <= p) return; p = v; var b = el('bootBar'); if (b) b.style.setProperty('--p', Math.min(100, v).toFixed(1) + '%'); };
  window.__bootSeen = function () { t0 = Date.now(); };   // a game file arrived: start-up is still moving
  window.__boot = function (s) { stage = window.__bootStage = s; t0 = Date.now(); n++; window.__bootBar(92 + n * 1.6); var m = el('bootMsg'); if (m) m.textContent = s + '…'; };
  window.__bootDone = function () { var b = el('boot'); if (b) b.remove(); clearInterval(iv); };
  var iv = setInterval(function () {
    var b = el('boot'); if (!b) { clearInterval(iv); return; }
    if (Date.now() - t0 < 12000) return;
    clearInterval(iv);
    var gl2 = false; try { gl2 = !!document.createElement('canvas').getContext('webgl2'); } catch (e) {}
    el('bootMsg').textContent = 'Still starting. It stopped at: ' + stage + '.';
    el('bootInfo').textContent = 'Please screenshot this for Claude. WebGL 2: ' + (gl2 ? 'yes' : 'NO') + ' · ' + navigator.userAgent;
    el('bootRetry').hidden = false; el('bootRetry').onclick = function () { location.reload(); };
  }, 1000);
})();
</script>

/* ---------- the spell tooltip, as World of Warcraft writes one (spellhud.js spellTipHTML) ----------
   The name in gold (a rank, "Spell" or the hotkey small on its right), two white stat rows (mana | range, cast |
   cooldown), the brief in pale gold, then muted lines under a thin gap. The command card, the gear sheet and the hero
   spell float it (#spell-hud-tip, .hp-tip); the talent pane and the Spellbook set it in their page. */
.wtip { box-sizing: border-box; color: #fff; font: 13px/1.38 var(--f-ui, system-ui, sans-serif); text-align: left; }
#spell-hud-tip, .hp-tip.wtip {
  width: 300px; max-width: calc(100vw - 16px); padding: 9px 12px 10px;
  background: rgba(6, 10, 14, .94); border: 1px solid #77705c; border-radius: 4px;
  box-shadow: 0 0 0 1px #000, 0 8px 24px #000b;
}
#spell-hud-tip { position: fixed; z-index: 100000; pointer-events: none; }
#spell-hud-tip[hidden] { display: none; }
.hp-tip.wtip { gap: 0; width: 270px; }
.wtip i { font-style: normal; }
.wtip .wt-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 2px; }
.wtip .wt-n { color: #ffd479; font: 600 16px/1.2 var(--f-display, Georgia, serif); letter-spacing: .01em; }
.wtip .wt-k { flex: none; color: #b9b5a6; font-size: 11.5px; }
.wtip kbd { flex: none; font: 600 11px/1.5 var(--f-ui, system-ui, sans-serif); color: #d9d3c2; border: 1px solid #5d5a4d; border-radius: 3px; padding: 0 5px; }
.wtip .wt-r { display: flex; justify-content: space-between; gap: 12px; color: #fff; font-size: 13px; line-height: 1.32; }
.wtip .wt-r i:last-child { text-align: right; }
.wtip .wt-d { margin-top: 4px; color: #f3d98f; }
.wtip .wt-role { margin: -1px 0 4px; color: #c9c4b4; font-size: 12px; }
.wtip .wt-sv { margin: -2px 0 4px; color: #9fb48a; font-size: 12px; }
.wtip .wt-sv b { color: #cfe6b0; font-weight: 600; }
.wtip .wt-s { margin-top: 5px; font-size: 12px; color: #6f6c62; }
.wtip .wt-s i.on { color: #8fd0ff; }
.wtip .wt-s b { font-weight: 400; color: #5a574e; }
.wtip .wt-tag { display: flex; align-items: center; gap: 6px; flex: none; }
.wtip .wt-lock { width: 11px; height: 13px; fill: #b9b5a6; stroke: #b9b5a6; }
.wtip .wt-dim .wt-n { color: #a89a78; }
.wtip .wt-dim .wt-r, .wtip .wt-dim .wt-d, .wtip .wt-dim .wt-t { opacity: .6; }
/* the talent panel: no side pane; each talent's tooltip floats at its node (ui.js renderTip) */
.tc-det { display: none !important; }
.wtip .wt-c { margin-top: 4px; color: #e08a78; font-size: 12px; }
.wtip .tal-old .td-art, .wtip .tal-old .tc-btn, .wtip .tal-old .td-wait, .wtip .tal-old .td-hint { display: none; }
.wtip .tal-old h3 { margin: 0 0 2px; color: #ffd479; font: 600 16px/1.2 var(--f-display, Georgia, serif); }
.wtip .tal-old p, .wtip .tal-old h5 { margin: 3px 0; font-size: 12.5px; }
.wtip .wt-t { margin-top: 5px; color: #b7b2a2; font-size: 11.5px; }
.wtip .wt-u { margin-top: 5px; color: #9fd47a; font-size: 12.5px; }
.wtip .wt-f { margin-top: 7px; color: #9d9a8e; font-size: 11.5px; line-height: 1.35; }
/* set in a page: the talent pane's spell talents and the Spellbook's spells */
.td-sec.wtip, .spbk-tip { padding: 9px 12px 10px; background: rgba(6, 10, 14, .82); border: 1px solid #5f5a48; border-radius: 4px; }
.spbk-tip { flex: 1; min-width: 0; }
.wtip .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; }

/* ---------- the item card (itempower.js itemCardHTML) and its floating tooltip (itemtip.js) ----------
   An RPG item tooltip: the name in its rarity's colour, kind and slot in small grey, the stat lines in white with bold
   numbers, the ability in green, a flavour line in gold italics, the price at the foot. Dark and see-through, its thin
   border tinted by the rarity (--rc). */
#itip { position: fixed; left: 0; top: 0; z-index: 10000; pointer-events: none; width: max-content; max-width: min(300px, calc(100vw - 16px)); }
#itip[hidden] { display: none !important; }
.itc { --rc: #cfc8b8; box-sizing: border-box; padding: 8px 10px 7px; border-radius: 5px; background: rgba(8, 10, 16, .93);
  border: 1px solid color-mix(in srgb, var(--rc) 55%, #1a1d24); box-shadow: 0 0 0 1px #000, 0 6px 18px rgba(0, 0, 0, .65);
  font: 13px/1.35 var(--f-ui); color: #fff; text-align: left; }
.itc-n { margin: 0; font: 700 16px/1.2 var(--f-ui); color: var(--rc); letter-spacing: .01em; }
.itc-k { margin: 1px 0 5px; font-size: 11.5px; color: #9a9ca2; }
.itc-s { margin: 0 0 5px; padding: 0; list-style: none; }
.itc-s li { padding: 0; color: #f4f4f4; font-size: 13px; }
.itc-s li b { font-weight: 800; color: #fff; }
.itc-ab { margin: 4px 0 0; color: #4ee05a; font-size: 12.5px; }
.itc-ab b { font-weight: 700; }
.itc-ab i { font-style: normal; color: #b8c0b8; white-space: nowrap; }
.itc-ab.act { color: #6af07a; }
.itc-tw { margin: 2px 0 4px; font-size: 12.5px; font-weight: 700; color: #ffb45a; }
.itc-bd { margin: 6px 0 0; font-size: 12px; color: #e8c872; }
.itc-bd b { color: #ffcf7a; }
.itc-fl { margin: 6px 0 0; font-style: italic; font-size: 12px; color: #e8c872; }
.itc-eq { margin: 5px 0 0; font-size: 11.5px; color: #9ad8ff; }
.itc-pr { margin: 6px 0 0; font-size: 12px; color: #e6e6e6; }

/* the favoured unit's signature, readable without hovering (owner, 5 Nov 2026) */
.hx-bars li.fav{grid-column:1/-1;order:-1;align-items:center;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;padding:8px 10px;margin-bottom:4px;border-radius:10px;background:linear-gradient(90deg,rgba(255,224,138,.12),rgba(255,224,138,.03));box-shadow:inset 0 0 0 1px rgba(255,224,138,.45)}

.hx-bars li.fav b{display:block;color:#ffe08a;font-weight:700;font-size:14px}

/* small game tooltip for every title hint (itemtip.js gtip; id hovtip: CSS ids ignore case in quirks mode, so never one that differs from another only in case) */
#hovtip { position: fixed; left: 0; top: 0; z-index: 10001; pointer-events: none; width: max-content; max-width: min(280px, calc(100vw - 16px));
  padding: 6px 9px; border-radius: 7px; background: rgba(14, 11, 8, .94); color: #e9dfc8; font: 500 12.5px/1.35 var(--f-ui);
  box-shadow: 0 0 0 1px #02090a, inset 0 0 0 1px rgba(212, 171, 87, .45), 0 6px 16px rgba(0, 0, 0, .55); white-space: normal; }

/* commander tabs: no box behind the selected tab (its edges cut through the round icons); the icon's ring and the label carry it */

.hx-ic img{box-sizing:border-box}

.hx-ic:hover img{border-color:#d9bd7a}
.hx-ic.on span{color:#ffe5aa}

/* item cards: stats as plain lines (no coloured number boxes), names in the game's fantasy display face, legendaries revealed in orange (owner, 5 Nov 2026) */
.sp-card .itc-s li { display: block; }
.sp-card .itc-s li b { display: inline; width: auto; flex: none; padding: 0; margin: 0 3px 0 0; border-radius: 0; background: none; color: #fff; font: 800 13px/1.3 var(--f-ui); text-align: left; }
.itc-n { font-family: var(--f-display); font-weight: 700; letter-spacing: .02em; font-size: 17px; }
.rn-leg .itc-n, .itc[style*="#ff8c1a"] .itc-n { font-family: var(--f-deco); font-size: 18px; text-shadow: 0 0 10px rgba(255, 140, 26, .55); }
.rn-ic.rn-leg { position: relative; overflow: hidden; animation: rnLegIn 1.1s cubic-bezier(.2, .8, .3, 1) both, rnLegGlow 2.4s ease-in-out 1.1s infinite; }
.rn-ic.rn-leg::after { content: ""; position: absolute; inset: -40% -60%; pointer-events: none; background: linear-gradient(105deg, transparent 42%, rgba(255, 200, 120, .55) 50%, transparent 58%); transform: translateX(-60%); animation: rnLegSweep 1.4s ease-out .25s 1 both; }
@keyframes rnLegIn { 0% { transform: scale(.86); opacity: 0; box-shadow: 0 0 0 2px #ff8c1a, 0 0 0 rgba(255, 140, 26, 0); } 55% { transform: scale(1.04); opacity: 1; box-shadow: 0 0 0 3px #ffb347, 0 0 42px rgba(255, 140, 26, .9); } 100% { transform: scale(1); box-shadow: 0 0 0 2px #ff8c1a, 0 0 16px rgba(255, 140, 26, .5); } }
@keyframes rnLegGlow { 0%, 100% { box-shadow: 0 0 0 2px #ff8c1a, 0 0 14px rgba(255, 140, 26, .45); } 50% { box-shadow: 0 0 0 2px #ffb347, 0 0 26px rgba(255, 160, 50, .75); } }
@keyframes rnLegSweep { to { transform: translateX(60%); } }
@media (prefers-reduced-motion: reduce) { .rn-ic.rn-leg, .rn-ic.rn-leg::after { animation: none; } }
/* a Conclave weave talent's two school marks (ui.js, the talent card) */
.td-sec.ccw p { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ccw-s { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.ccw-s::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }

/* ---------- the bag, WoW-style: hover reads an item (its card, #itip); a click picks it and its actions open in a
   small row anchored to its cell (.bg-pop, id gTip), or sockets it straight in when a socket is open ---------- */
.bg-gw { position: relative; }
.bg-pop { position: absolute; left: 0; top: 0; z-index: 6; width: max-content; max-width: min(360px, 100%); padding: 5px;
  border-radius: 5px; background: rgba(8, 10, 16, .95); border: 1px solid #a98a5066; box-shadow: 0 0 0 1px #000, 0 6px 16px rgba(0, 0, 0, .6); }

.itc .itc-hint { margin: 6px 0 0; font-size: 11px; color: #8a8f96; }
.itc .itc-no { margin: 5px 0 0; font-size: 11.5px; color: #ff8a7a; }
.itc .pv { margin: 6px 0 0; }
.itc .bg-set { margin: 6px 0 0; }

/* ---------- the gear sheet: its bag strip, drag and drop, the preview, the stat groups, each spell's damage ---------- */
.gp-bag { grid-column: 1 / -1; margin-top: 4px; }
.gp-bag h3 { margin: 0 0 4px; font: 400 15px/1.1 var(--f-display); color: var(--gold-hi); }
.gp-bag h3 small { font: 500 11px/1.2 var(--f-ui); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.gp-bgrid { display: grid; grid-template-columns: repeat(auto-fill, 46px); gap: 5px; max-height: 112px; overflow: auto; padding: 4px; border-radius: 5px; background: rgba(0, 0, 0, .3); box-shadow: inset 0 0 0 1px #203335; }
.gp-bgrid .gp-none { grid-column: 1 / -1; margin: 6px; font-size: 12px; }
.gp-bc { touch-action: none; cursor: grab; }
.gp-sock:not(.off):not(.empty) { touch-action: none; }
.gp-bag.gp-drop .gp-bgrid, .gp-sock.gp-drop canvas { box-shadow: 0 0 0 2px #8fe07a, 0 0 12px rgba(143, 224, 122, .55); }
.gp-sock.gp-nodrop canvas, .gp-bag.gp-nodrop .gp-bgrid { box-shadow: 0 0 0 2px #ff7a6a; }
.gp-dragging, .gp-dragging * { cursor: grabbing !important; }
.gp-ghost { position: fixed; left: 0; top: 0; width: 56px; height: 56px; z-index: 10002; pointer-events: none; opacity: .9; border-radius: 4px; box-shadow: 0 6px 16px rgba(0, 0, 0, .7); }
.gp-stats.pv { box-shadow: inset 0 0 0 1px rgba(143, 224, 122, .35); border-radius: 4px; }
.gp-side h3 .gp-pvh { font: 500 11.5px/1.2 var(--f-ui); color: #8fe07a; letter-spacing: 0; margin-left: 6px; }
.gp-sth { margin: 6px 0 0; font: 400 12px/1.2 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: #c9b48a; }
.gp-st.gp-tx b { font-weight: 600; font-size: 12.5px; }
.gp-dmg { margin: 1px 0 2px; font: 600 13px/1.25 var(--f-ui); color: #e9e0c8; }
.gp-dmg b { font-size: 15px; color: #fff3d0; }
.gp-dmg b.bo { color: #8fe07a; } .gp-dmg b.neg { color: #ff9a7a; }
.gp-dmg .gp-why { display: block; font: 500 11.5px/1.3 var(--f-ui); color: #b9c4c8; }
.gp-dmg i { font-style: normal; color: #7c8a86; text-decoration: line-through; font-size: 12px; }
.gp-dmg small { color: var(--muted); font-weight: 500; font-size: 11px; }
.gp-body { scrollbar-gutter: stable; }   /* (a preview that adds rows must not bring in a scrollbar and move the bag under the cursor) */
.gp-st.gp-ist { flex-wrap: wrap; } .gp-st.gp-ist span { flex: 0 0 auto; } .gp-st.gp-ist b { flex: 1 1 100%; font-size: 12.5px; }
.gp-bgrid .gp-bc { width: 46px; height: 46px; aspect-ratio: auto; }   /* (fixed: a cell sized by its canvas could grow taller than wide) */
.gp-bgrid .gp-bc canvas { width: 46px; height: 46px; }

/* ================= Phones (mobile UI audit, docs/mobile_ui_audit.md) =================
   Safe areas first: these use max(old, inset), so they change nothing where the insets are 0 (every desktop browser).
   Everything else sits behind the phone queries: portrait (max-width:600px) and short landscape (max-height:560px). */
#bar{padding-top:max(6px,var(--sa-t))}
#console{padding-bottom:max(8px,var(--sa-b))}

  /* the side console kept its width when the notch's inset padded it: the card ran under the notch */
  #console{width:calc(var(--btn) * 4 + 30px + max(8px,var(--sa-r)))}
}

/* The Chronicles: the region map, the warband, a location's card and its Hunts (campaign.js, hunts.js). Painted codex surfaces as in uipolish.css. */

.cm-hd{position:relative;padding:0 50px;text-align:center}
.cm-hd .ttl{margin:0 0 4px}.cm-hd .sub{margin:0 auto 10px;max-width:760px;text-transform:none;letter-spacing:0;font-size:13.5px;line-height:1.45;color:var(--text-soft)}

.cm-tab.on{color:#f1d8a1;background:#26322b;border-color:#b99e61;box-shadow:inset 0 -2px #c4a364}
.cm-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:14px;align-items:start}
.cm-map{border:1px solid #b99a5d;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 4px #0b1518,0 10px 30px #0008;background:#1b2219}
.cm-svg{display:block;width:100%;height:auto}
.cm-hills ellipse{fill:#6a6440;opacity:.35}
.cm-river{fill:none;stroke:#3f6f78;stroke-width:16;stroke-linecap:round;opacity:.75}
.cm-woods circle{fill:#1f3522;stroke:#2c4a2c;stroke-width:2;opacity:.85}
.cm-road{fill:none;stroke:#8c7650;stroke-width:5;stroke-dasharray:2 9;stroke-linecap:round;opacity:.85}
.cm-road.done{stroke:#ead29a;stroke-dasharray:none;opacity:1;filter:drop-shadow(0 0 4px #e8c97a88)}
.cm-n{cursor:pointer;outline:none}
.cm-halo{fill:none;stroke:#ead29a;stroke-width:2;opacity:0}
.cm-disc{fill:#16232a;stroke:#a98a50;stroke-width:3}
.cm-sun{fill:#f0c86a}.cm-moon{fill:#bcd4ff}.cm-field{fill:none;stroke:#b6d27a;stroke-width:3;stroke-linecap:round}
.cm-rn{fill:#ead29a;font:700 15px var(--f-display);text-anchor:middle;paint-order:stroke;stroke:#0b1114;stroke-width:4}
.cm-nm{fill:#d9e2da;font:600 12.5px var(--f-ui);text-anchor:middle;paint-order:stroke;stroke:#0b1114;stroke-width:4}
.cm-star{fill:#ffd770;font-size:20px;paint-order:stroke;stroke:#0b1114;stroke-width:3}
.cm-flag{fill:#c0392b;stroke:#ead29a;stroke-width:2}
.cm-n.won .cm-disc{fill:#24382c;stroke:#ead29a}

.cm-n.far{opacity:.55}.cm-n.far .cm-disc{stroke:#5d5440}

@media(prefers-reduced-motion:reduce){.cm-n.here .cm-halo{animation:none}}
.cm-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.cm-band{display:flex;gap:12px;padding:12px;background:radial-gradient(ellipse at 0 0,#a98a501c,transparent 70%),#0c1419;border:1px solid #a98a504a;border-radius:4px;box-shadow:inset 0 0 0 3px #0003}

.cm-face{width:84px;height:84px;object-fit:cover;border:1px solid #b69b68;border-radius:4px;flex:none}
.cm-bi{min-width:0;flex:1}
.cm-stats{display:flex;flex-wrap:wrap;gap:6px 12px;margin:6px 0;font:500 11px/1.2 var(--f-ui);color:#a6b5a9}
.cm-stats span{display:flex;flex-direction:column}.cm-stats b{font:700 16px var(--f-ui);color:#f1d8a1}
.cm-at{margin:0;font-size:12.5px;color:#cfd8cf}
.cm-drop{margin-top:8px;min-height:36px;padding:4px 10px;border:1px solid #7a4a3a;border-radius:3px;background:#1d1715;color:#d7a796;font:500 12px var(--f-ui);cursor:pointer}

.cm-loc{padding:14px;background:linear-gradient(135deg,#18242a,#0d171c);border:1px solid #a98a5044;border-radius:4px;line-height:1.45;font-size:13.5px;color:#d7ddd5}
.cm-loc h3 span{display:block;font:600 11px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#b99e61}
.cm-loc h4{margin:12px 0 4px;color:#ead29a;font:600 14px var(--f-display);letter-spacing:.03em}
.cm-loc p{margin:0 0 4px}.cm-say{font-style:italic;color:#c3ccc4}.cm-tag{font-size:12px;color:#a6b5a9}
.cm-foes{display:block;margin-top:3px;font-size:12.5px;color:#b9c2bd}.cm-foes small{color:#8e9d93}
.cm-bosses{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px;font-size:12.5px}
.cm-bosses li span{display:inline-block;min-width:24px;color:#b99e61;font-weight:700}
.cm-bosses li.lord{color:#ffd9a0}.cm-bosses i{font-size:11px;color:#e0a060}.cm-bosses b{color:#8fdc8f}
.cm-rites{margin:0;padding-left:18px;font-size:12.5px}.cm-rites li.new b{color:#ffd770}
.cm-note{font-size:12.5px;color:#a6b5a9}
.cm-loc .btn{width:100%;margin-top:12px}
.cm-ft{display:flex;justify-content:center;gap:10px;margin-top:14px}.cm-ft .btn{min-width:200px}
.cm-end{margin:10px auto;max-width:560px;padding:10px 14px;border:1px solid #a98a5055;border-radius:4px;background:#0c1419;line-height:1.45;font-size:14px;color:#d7ddd5;text-align:left}

#rXp.capped #hXpF{background:linear-gradient(90deg,#b58a2c,#ffd770)}
@media(max-width:860px){.cm-body{grid-template-columns:1fr}.cm-hd{padding:0 46px 0 0;text-align:left}.cm-ft .btn{min-width:0;flex:1}.panel.campaign{padding:12px}}

/* ---------- the tutorial (tutorial.js): the coach card in the field's corner, the ring on what it talks about, the title's
   Tutorial button and the chapter list. The coach is placed by tutPlaceCoach inside the field (#stage), so it never covers
   the command card or the top bar; it sits above pages (z 12, over .ov's 10) so a lesson can talk about the talent tree,
   the Bag and the boss's loot while they are open, and folds to one line with its − button. ---------- */
.tut-coach{position:fixed;left:8px;bottom:8px;z-index:12;box-sizing:border-box;width:min(330px,calc(100vw - 16px));max-height:60vh;overflow:auto;overscroll-behavior:contain;
  padding:8px 10px 9px;border-radius:9px;text-align:left;color:#efe4c8;font:500 13px/1.32 var(--f-ui);
  background:linear-gradient(180deg,rgba(10,34,37,.95),rgba(4,16,18,.95));box-shadow:0 0 0 1px #02090a,inset 0 0 0 1px rgba(201,160,90,.6),0 6px 18px rgba(0,0,0,.5);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tut-coach[hidden]{display:none!important}
.tut-coach .tc-top{display:flex;align-items:center;gap:7px;min-height:24px}
.tut-coach .tc-ch{flex:none;font:800 9.5px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#8fd0c4}
.tut-coach .tc-name{flex:1;min-width:0;font:700 14px/1.1 var(--f-display);color:#f6dc92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tut-coach button{font:700 12.5px/1.1 var(--f-ui);color:#f4e7c6;background:#123a3e;border:0;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(201,160,90,.6);
  min-height:34px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
.tut-coach button:hover{filter:brightness(1.15)}
.tut-coach button:focus-visible{outline:2px solid #ffe2a0;outline-offset:1px}
.tut-coach .tc-min{flex:none;min-width:34px;min-height:30px;padding:0;font-size:18px;line-height:1}
.tut-coach .tc-goal{margin:6px 0 0;font:700 14px/1.28 var(--f-ui);color:#ffe7a6}
.tut-coach .tc-tick{color:#9fd47a}
.tut-coach .tc-say{margin:5px 0 0;color:#d9e3dc}
.tut-coach .tc-foe{margin:7px 0 0;padding:6px 8px;border-radius:7px;background:rgba(0,0,0,.32);box-shadow:inset 0 0 0 1px rgba(143,208,196,.25)}
.tut-coach .tc-foe p{margin:0}
.tut-coach .tc-fn{font-size:12.5px;color:#f1dcb4}
.tut-coach .tc-fw{margin-top:4px!important;font-size:11.5px;color:#bcd0ca}
.tut-coach .tc-foe .tags{margin:4px 0 0}
.tut-coach .tc-prob{margin:6px 0 0;font-size:12px;color:#bcd0ca}
.tut-coach .tc-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tut-coach .tc-go{background:#6b4a14;box-shadow:inset 0 0 0 1px #f2d27a}
.tut-coach .tc-sm{margin-left:auto;min-height:30px;padding:4px 9px;font-size:11.5px;background:transparent;box-shadow:inset 0 0 0 1px rgba(143,208,196,.35);color:#bcd0ca}
.tut-coach .tc-dots{display:flex;gap:4px;margin-top:7px}
.tut-coach .tc-dots i{width:7px;height:7px;border-radius:50%;background:#26474a}
.tut-coach .tc-dots i.on{background:#9fd47a}
.tut-coach .tc-dots i.cur{background:#f6dc92;box-shadow:0 0 6px #f6dc92}
.tut-coach.min .tc-more{display:none}
.tut-coach.min .tc-goal{font-size:12.5px;margin-top:3px}
.tut-coach.done{box-shadow:0 0 0 1px #02090a,inset 0 0 0 1px #9fd47a,0 6px 18px rgba(0,0,0,.5)}
@media (max-width:600px),(max-height:500px){
  .tut-coach{padding:6px 8px 7px;font-size:12px}
  .tut-coach .tc-goal{font-size:13px}
  .tut-coach .tc-fw{display:none}
  .tut-coach button{min-height:32px;padding:5px 8px;font-size:12px}
}
/* the toast steps up over the coach while it is on */
body.tut-on #toast{bottom:calc(var(--tutH,0px) + 20px)}
/* the ring: a soft pulsing outline over what the step is about; it never takes a tap */
.tut-ring{position:fixed;z-index:13;pointer-events:none;box-sizing:border-box;border-radius:9px;border:2px solid #ffe08a;box-shadow:0 0 0 3px rgba(255,224,138,.25),0 0 16px rgba(255,214,120,.65);animation:tutPulse 1.3s ease-in-out infinite}
.tut-ring[hidden]{display:none!important}
@keyframes tutPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.tut-ring{animation:none}}
.spbk-spell.tut-mark{box-shadow:inset 0 0 0 2px #ffe08a;border-radius:8px}
/* the title's Tutorial button: in the corner, off the frame's planks */
.t2-tut{position:fixed;z-index:11;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  min-height:44px;padding:7px 14px 8px;border:0;border-radius:8px;cursor:pointer;text-align:left;touch-action:manipulation;
  background:linear-gradient(180deg,#14393c,#0a2224);box-shadow:0 0 0 1px #02090a,inset 0 0 0 1px rgba(242,210,122,.7),0 4px 12px rgba(0,0,0,.45)}
.t2-tut span{font:700 15px/1.05 'Cinzel',serif;letter-spacing:.07em;color:#f6dc92;text-shadow:0 1px 2px #000}
.t2-tut small{font:600 11px/1.1 var(--f-ui);color:#b9d2ca}
.t2-tut:hover{filter:brightness(1.15)}
.t2-tut:focus-visible{outline:2px solid #ffe2a0;outline-offset:2px}
/* the chapter list */
.panel.tutl{width:min(560px,100%)}
.panel.tutl .ttl{text-align:center}
.tl-force{display:flex;gap:8px;justify-content:center;margin:4px 0 10px}
.tl-force button{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;padding:6px 10px;border:0;border-radius:8px;cursor:pointer;

.tl-force button small{font:500 11px/1.1 var(--f-ui);color:#9fc4bd}
.tl-force button.on{background:#123a3e;box-shadow:inset 0 0 0 2px #f2d27a;color:#ffe7a6}
.tl-list{display:flex;flex-direction:column;gap:5px;margin:10px 0 12px;text-align:left}
.tl-row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;border:0;border-radius:8px;cursor:pointer;text-align:left;

.tl-row:hover{filter:brightness(1.15)}
.tl-row .tl-n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font:800 13px/1 var(--f-ui);color:#f6dc92;background:#06191b;box-shadow:inset 0 0 0 1px rgba(242,210,122,.55)}

.tl-all{margin:0 0 10px;text-align:center;font:700 14px/1.3 var(--f-ui);color:#9fd47a}

.t2-btn.ptx-new{color:#ffd27a}
.t2-btn.ptx-new small{color:#e8c890}
.panel.ptx-setup{width:min(560px,calc(100vw - 32px));box-sizing:border-box}

.ptx-h{margin:14px 0 6px;font:700 15px var(--f-ui);color:#f2d27a}

.ptx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
