.ptx-it img{width:40px;height:40px;border-radius:5px;flex:none;background:#000}
.ptx-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.ptx-tx b{color:var(--rc,#eee);font:700 13px/1.2 var(--f-ui)}
.ptx-tx small{font-size:11px;line-height:1.3;color:#c8bfa6}
.ptx-tx .ptx-held{color:#8fd88f}
.ptx-take{flex:none;padding:6px 12px;border-radius:6px;border:1px solid rgba(242,210,122,.55);background:rgba(242,210,122,.12);color:#f6e7b8;font:700 12px var(--f-ui);cursor:pointer}
.ptx-take:hover,.ptx-take:focus-visible{background:rgba(242,210,122,.28);outline:none}
.ptx-set{margin:8px 0 10px;padding:8px;border-radius:8px;border:1px solid rgba(77,232,176,.25);background:rgba(77,232,176,.04)}

/* ---------- buffs.js: the info pane's row of status icons, their hover card, and the field's tiny icons ---------- */
#infoBody .bf-row{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0 4px}
.bf-ic{position:relative;display:inline-block;flex:none;width:22px;height:22px;border-radius:3px;background-color:#140f0a;background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:0 0 0 1px #02090a,0 1px 2px rgba(0,0,0,.6);cursor:help;overflow:hidden;outline:none}
.bf-ic:hover,.bf-ic:focus-visible{box-shadow:0 0 0 1px #02090a,0 0 0 2px #f0cd79,0 0 6px rgba(240,205,121,.55)}
/* a timed status: the part that has run out darkens round the clock */
.bf-ic::after,.bf-fi::after{content:'';position:absolute;inset:0;pointer-events:none;background:conic-gradient(rgba(6,4,2,.66) calc(var(--p,0) * 1turn),transparent 0);opacity:0}
.bf-ic.bf-tm::after,.bf-fi.bf-tm::after{opacity:1}
/* a gauge (heat, Growth, an armour bar): a bar along the bottom */
.bf-ic .bf-g{position:absolute;left:1px;right:1px;bottom:1px;height:3px;border-radius:1px;background:rgba(0,0,0,.7);display:none}
.bf-ic.bf-ga .bf-g{display:block}
.bf-ic .bf-g::before{content:'';position:absolute;left:0;top:0;bottom:0;width:calc(var(--g,0) * 100%);background:#f0d079;border-radius:1px}
.bf-ic.bf-debuff .bf-g::before{background:#ff8a6a}
.bf-ic.bf-state .bf-g::before{background:#9fe4ff}
/* stacks */
.bf-ic .bf-n{position:absolute;right:1px;bottom:0;z-index:1;font:800 10px/1 var(--f-ui,system-ui,sans-serif);color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;pointer-events:none}
.bf-ic .bf-n:empty{display:none}
.bf-ic.bf-ga .bf-n{bottom:4px}
/* the card, inside the item tooltip's panel */
#itip .kwc.bf-card{position:static;max-width:min(270px,calc(100vw - 16px))}
.kwc.bf-card .bf-src{margin:1px 0 0;font-size:11.5px;color:#c9b88f;font-style:italic}
/* on the field: up to four tiny icons over a foe's health bar */
.bf-f{position:absolute;left:0;top:0;z-index:1;display:flex;gap:1px;pointer-events:none;will-change:transform}
.bf-fi{position:relative;display:block;width:13px;height:13px;border-radius:2px;background-color:#140f0a;background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:0 0 0 1px rgba(0,0,0,.85);overflow:hidden}
@media (max-width:560px){.bf-fi{width:11px;height:11px}}
@media (prefers-reduced-motion:reduce){.bf-f{will-change:auto}}
/* the effects bar, top right of the field (owner, 9 Nov 2026): whose effects, buffs in a row, debuffs in a row under it */
#bfBar{position:absolute;right:max(8px,env(safe-area-inset-right));top:8px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:min(292px,calc(100% - 16px));padding:4px 6px 5px;border-radius:8px;background:rgba(3,15,17,.62);box-shadow:0 0 0 1px #02090a,inset 0 0 0 1px rgba(201,160,90,.38);pointer-events:auto;transition:opacity .15s}
#bfBar[hidden]{display:none}
#bfBar.ghost{opacity:.25;pointer-events:none}
#bfBar .bfb-who{display:flex;align-items:center;gap:5px;max-width:100%;min-width:0}
#bfBar .bfb-who b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 11.5px/1.1 var(--f-display,serif);color:var(--rk-gold-hi,#f5e09a);letter-spacing:.02em}
#bfBar .bfb-pt{flex:none;width:18px;height:18px;border-radius:3px;background:#140f0a center/cover no-repeat;box-shadow:0 0 0 1px #02090a,inset 0 0 0 1px rgba(234,196,123,.5)}
#bfBar .bfb-pt.foe{box-shadow:0 0 0 1px #02090a,inset 0 0 0 1px rgba(226,110,90,.6)}
#bfBar .bfb-pt.none{display:none}
#bfBar .bfb-row{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px;max-width:100%}
#bfBar .bfb-c{display:flex;flex-direction:column;align-items:center;width:26px}
#bfBar .bf-ic{width:26px;height:26px}
#bfBar .bf-ic.bf-buff{box-shadow:0 0 0 1px #02090a,0 0 0 2px rgba(212,171,87,.75)}
#bfBar .bf-ic.bf-debuff{box-shadow:0 0 0 1px #02090a,0 0 0 2px rgba(200,70,58,.85)}
#bfBar .bf-ic.bf-state{box-shadow:0 0 0 1px #02090a,0 0 0 2px rgba(106,160,184,.7)}
#bfBar .bf-ic.bf-trait{box-shadow:0 0 0 1px #02090a,0 0 0 2px rgba(140,124,92,.6)}
#bfBar .bf-ic:hover,#bfBar .bf-ic:focus-visible{box-shadow:0 0 0 1px #02090a,0 0 0 2px #f0cd79,0 0 7px rgba(240,205,121,.6)}
#bfBar .bfb-t{display:block;height:10px;margin-top:2px;font:700 9.5px/10px var(--f-ui,system-ui,sans-serif);font-style:normal;color:#e6dcc4;text-shadow:0 1px 1px #000;pointer-events:none;white-space:nowrap}
#bfBar .bfb-t:empty{visibility:hidden}
#bfBar .bfb-dn .bfb-t{color:#ffb8a8}
@media (max-width:560px),(max-height:520px){
  #bfBar{max-width:min(200px,calc(100% - 16px));padding:3px 4px 4px;gap:2px}
  #bfBar .bfb-who b{font-size:10.5px}
  #bfBar .bfb-pt{width:15px;height:15px}
  #bfBar .bfb-c{width:20px}
  #bfBar .bf-ic{width:20px;height:20px}
  #bfBar .bfb-t{font-size:8.5px;height:9px;line-height:9px;margin-top:1px}
}
/* Quiet desktop-fantasy menus. Loaded after the feature styles so every overlay
   shares readable type, dark surfaces and fine bronze rules. Artwork stays in
   portraits, spell paintings and talent trees, rather than around every button. */
:root {
  --cm-surface: #0c1412;
  --cm-raised: #17221c;
  --cm-text: #ece8dc;
  --cm-muted: #b2b9ab;
  --cm-bronze: #a58b56;
  --cm-rule: #a58b563b;
  --cm-selected: #74825b38;
}
.ov.ov-clean { background: #0308079c; backdrop-filter: blur(2px); }
.panel.clean-menu {
  color: var(--cm-text); font: 400 15px/1.5 var(--f-ui); letter-spacing: 0;
  --f-deco: var(--f-display); --text-soft: var(--cm-muted);
  scrollbar-color: #68745b #0c1412; scrollbar-width: thin;
}
.panel.clean-menu:not(.tal):not(.pausep) {
  background: linear-gradient(125deg, #14201af5, #0b1211fa 65%);
  border: 1px solid var(--cm-rule); border-image: none; border-radius: 2px;
  box-shadow: 0 18px 64px #0009; max-height: calc(var(--vh-safe) - 40px);
  padding: 24px; overflow-y: auto; text-align: left;
}
.panel.clean-menu::before, .clean-menu .ttl::before, .clean-menu .ttl::after { display: none; }
.panel.clean-menu .ttl {
  position: static; transform: none; margin: 0 0 8px; padding: 0;
  font: 500 clamp(28px, 3vw, 36px)/1.15 var(--f-display); text-align: left;
  letter-spacing: -.015em; text-transform: none; color: var(--cm-text);
  background: none; -webkit-text-fill-color: currentColor; -webkit-text-stroke: 0;
  text-shadow: none; filter: none;
}
.panel.clean-menu .sub {
  display: block; margin: 0 0 16px; padding: 0; min-height: 0;
  border: 0; border-image: none; background: none; box-shadow: none; filter: none;
  font: 400 14px/1.5 var(--f-ui); text-transform: none; letter-spacing: 0;
  color: var(--cm-muted); text-align: left; cursor: default;
}
.clean-menu :is(.btn, .seg button, .tc-btn, .sp-go) {
  font-family: var(--f-ui); font-weight: 600; letter-spacing: 0;
  text-shadow: none; filter: none; border-image: none; border-radius: 2px;
}
.clean-menu :is(.btn, .tc-btn, .sp-go) {
  background: var(--cm-raised); color: var(--cm-text);
  border: 1px solid var(--cm-rule); box-shadow: none; font-size: 15px;
}
.clean-menu .btn small, .clean-menu .seg button small {
  font: 400 13px/1.4 var(--f-ui); color: var(--cm-muted);
  letter-spacing: 0; opacity: 1; margin-top: 3px;
}
.clean-menu :is(button, select, input, a):focus-visible { outline: 2px solid #c8b583; outline-offset: 3px; }
.clean-menu button { cursor: pointer; touch-action: manipulation; }
.clean-menu button:disabled { opacity: .5; cursor: default; }
.clean-menu button:hover:not(:disabled) { background-color: #75835b20; filter: none; }
.clean-menu button:active:not(:disabled) { transform: none; filter: none; }
.clean-menu :is(.tx, .tc-x) {
  border: 1px solid var(--cm-rule); border-radius: 2px;
  background: #101a16; color: var(--cm-text); box-shadow: none;
}
.clean-menu kbd { font: 400 12px/1.2 var(--f-ui); color: var(--cm-muted); }
.clean-menu select {
  min-width: 96px; max-width: 60%; min-height: 36px; padding: 5px 10px;
  color: var(--cm-text); background: #111b17; border: 1px solid #a58b566b;
  border-radius: 2px; font: 400 14px/1.4 var(--f-ui); cursor: pointer;
}
.clean-menu .cm-heading { padding-bottom: 17px; margin-bottom: 16px; border-bottom: 1px solid var(--cm-rule); }
.clean-menu .cm-heading .sub { margin: 0; }
.clean-menu :is(.cm-quick, .cm-section) h3 {
  font: 600 18px/1.4 var(--f-ui); letter-spacing: .01em; color: var(--cm-text);
  padding: 0 0 16px; margin: 0; border-bottom: 1px solid var(--cm-bronze); text-align: left;
}

/* The pause screen: independent navigation and settings panels, as in the approved reference. */
.panel.pausep.clean-menu {
  width: min(840px, calc(var(--vw-safe) - 40px)); max-width: 100%; padding: 0;
  border: 0; border-image: none; border-radius: 0; filter: none;
  background: none !important; box-shadow: none !important; --s: 1px;
}
.cm-pause { display: grid; grid-template-columns: minmax(260px, .85fr) minmax(350px, 1.15fr); gap: 16px; }
.cm-nav, .cm-quick {
  position: relative; min-width: 0; padding: 26px;
  background: linear-gradient(125deg, #121e18f7, #09110ff7 80%);
  border: 1px solid var(--cm-rule); border-radius: 2px; box-shadow: 0 18px 64px #0008;
}
.cm-nav::before, .cm-quick::before, .cm-nav::after, .cm-quick::after {
  content: ''; position: absolute; width: 12px; height: 12px; pointer-events: none;
}
.cm-nav::before, .cm-quick::before { left: 7px; top: 7px; border-top: 1px solid var(--cm-bronze); border-left: 1px solid var(--cm-bronze); }
.cm-nav::after, .cm-quick::after { right: 7px; bottom: 7px; border-bottom: 1px solid var(--cm-bronze); border-right: 1px solid var(--cm-bronze); }
.cm-nav { display: flex; flex-direction: column; }
.panel.pausep.clean-menu .cm-nav .ttl { font-size: 38px; margin-bottom: 4px; }
.panel.pausep.clean-menu .cm-nav .sub { font-size: 13px; }
.panel.pausep.clean-menu .cm-nav .btn {
  display: block; width: 100%; align-self: auto; min-height: 44px;
  padding: 11px 12px; margin: 0; border: 0; border-image: none;
  background: none; box-shadow: none; border-radius: 0; text-align: left;
  font: 600 16px/1.3 var(--f-ui); color: var(--cm-text);
  letter-spacing: 0; text-shadow: none; filter: none;
}
.panel.pausep.clean-menu .cm-nav .btn small { margin-top: 4px; font: 400 13px/1.35 var(--f-ui); color: var(--cm-muted); }
.panel.pausep.clean-menu .cm-nav #pRes {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 46px; font-size: 16px; color: var(--cm-text);
  border-left: 2px solid #b39a60; background: linear-gradient(90deg, #7c895143, #7c895114);
}
.panel.pausep.clean-menu .cm-nav .btn:hover:not(:disabled) { background-color: #74825b24; }
.cm-nav-utility { border-top: 1px solid var(--cm-rule); padding-top: 10px; margin-top: 14px; }
.cm-nav-footer { border-top: 1px solid var(--cm-rule); padding-top: 10px; margin-top: auto; }
.panel.pausep.clean-menu .cm-nav .cm-abandon { color: #d38f7b; margin-top: 12px; }
.panel.pausep.clean-menu .cm-nav .cm-abandon.danger { background: #943c262b; color: #ffb5a0; }
.cm-quick { display: flex; flex-direction: column; }
.clean-menu .cm-display.seg { display: flex; flex-direction: column; gap: 0; margin: 0; }
.clean-menu .cm-setting, .clean-menu .cm-display > button {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 60px; padding: 12px 0; margin: 0;
  border: 0; border-bottom: 1px solid var(--cm-rule); border-image: none; border-radius: 0;
  font: 400 16px/1.4 var(--f-ui); color: var(--cm-text); letter-spacing: 0;
  background: none; box-shadow: none; text-align: left; filter: none;
}
.clean-menu .cm-display > button { flex: auto; flex-direction: row; white-space: normal; }
.clean-menu .cm-display > button small, .clean-menu button.cm-setting > small, .clean-menu .cm-toggle small {
  display: inline-block; flex: none; min-width: 50px; margin: 0; padding: 4px 10px;
  text-align: center; border: 1px solid #a58b5666; border-radius: 1px;
  font: 400 14px/1.35 var(--f-ui); color: var(--cm-muted); white-space: normal;
}
.clean-menu :is(.cm-display > button, button.cm-setting, .cm-toggle)[aria-pressed=true] small { color: #e3e6d7; border-color: #a58b56a0; background: var(--cm-selected); }
.clean-menu .cm-audio { padding: 8px 0 17px; border-bottom: 1px solid var(--cm-rule); }
.clean-menu .cm-audio .cm-setting { min-height: 42px; padding: 4px 0 8px; border: 0; }
.clean-menu .cm-toggle { padding: 0; border: 0; border-radius: 1px; background: none; min-height: 32px; }
.clean-menu .cm-volume { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 12px; align-items: center; }
.cm-volume output { color: #d4d8c9; text-align: right; font: 400 13px/1.2 var(--f-ui); font-variant-numeric: tabular-nums; }
.clean-menu .cm-volume input[type=range] {
  appearance: none; -webkit-appearance: none; display: block; width: 100%; min-width: 0;
  height: 28px; padding: 0; margin: 0; border: 0; border-radius: 0; cursor: pointer;
  background: linear-gradient(to right, #a89b70 0 var(--volume), #394239 var(--volume) 100%) center / 100% 3px no-repeat;
  box-shadow: none; accent-color: #c8ba8a; touch-action: pan-y;
}
.cm-volume input::-webkit-slider-runnable-track { height: 3px; background: transparent; }
.cm-volume input::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none; width: 10px; height: 15px; margin-top: -6px;
  border: 1px solid #e5d8ae; border-radius: 1px; background: #b5a575; box-shadow: 0 1px 4px #0008;
}
.cm-volume input::-moz-range-track { height: 3px; background: transparent; }
.cm-volume input::-moz-range-thumb { width: 9px; height: 14px; border: 1px solid #e5d8ae; border-radius: 1px; background: #b5a575; }
.cm-audio.muted .cm-volume { opacity: .65; }
.cm-keyhint { display: flex; align-items: center; gap: 10px; margin: auto 0 0; padding-top: 28px; color: var(--cm-muted); font-size: 13px; }
.cm-keyhint kbd { padding: 3px 6px; border: 1px solid #a58b5666; border-radius: 2px; }

/* The same layout language on Settings, reference pages and the codex menus. */
.panel.clean-menu.setp { width: min(800px, 100%); }
.cm-settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
.cm-section { min-width: 0; }
.clean-menu .cm-links { display: flex; gap: 12px; margin: 20px 0; padding: 16px 0; border-block: 1px solid var(--cm-rule); }
.cm-links button { flex: 1; padding: 8px; border: 0; background: none; font: 600 15px/1.3 var(--f-ui); color: var(--cm-text); text-align: left; }
.cm-links small { display: block; margin-top: 4px; font-weight: 400; color: var(--cm-muted); }
.clean-menu .tc { border: 1px solid var(--cm-rule); border-radius: 2px; background: #0d1715f7; box-shadow: 0 18px 64px #0008; }
.clean-menu .tc::before, .clean-menu .tc::after, .clean-menu .tc-cn { display: none; }
.clean-menu .tc-hd { border-bottom: 1px solid var(--cm-rule); padding-bottom: 14px; margin-bottom: 8px; }
.clean-menu .tc-ttl h2 { font: 500 clamp(24px, 3vw, 32px)/1.15 var(--f-display); color: var(--cm-text); letter-spacing: 0; text-shadow: none; }
.clean-menu .tc-ttl h2::before, .clean-menu .tc-ttl h2::after { display: none; }
.clean-menu :is(.tc-tab b, .wr-tabs button, .bg-tabs button, .wr-h) { font-family: var(--f-ui); letter-spacing: 0; }
.clean-menu :is(.wr-tabs button, .bg-tabs button) { background: transparent; color: var(--cm-muted); border-radius: 0; box-shadow: none; }
.clean-menu :is(.wr-tabs button, .bg-tabs button).on { background: var(--cm-selected); color: var(--cm-text); box-shadow: inset 0 -1px var(--cm-bronze); }
.clean-menu .tc-crest { box-shadow: none; border: 1px solid var(--cm-rule); }
.clean-menu .how-body { font-size: 15px; line-height: 1.65; color: #d5d9ce; }
.clean-menu .how-body li { margin-bottom: 12px; }
.clean-menu :is(.spbk-forces button, .spbk-units button) { border: 0; border-bottom: 1px solid var(--cm-rule); border-radius: 0; background: transparent; font-family: var(--f-ui); }
.clean-menu :is(.spbk-forces button, .spbk-units button).on { background: var(--cm-selected); color: var(--cm-text); box-shadow: inset 2px 0 var(--cm-bronze); }
.clean-menu .spbk-sub { max-width: none; font-size: 14px; }
.panel.spbk.clean-menu { height: min(900px, calc(var(--vh-safe) - 40px)); }
.panel.spbk.clean-menu > :is(.ttl, .spbk-sub, .spbk-forces, #spbkBack) { flex-shrink: 0; }
.clean-menu .spbk-spell { border: 0; border-top: 1px solid var(--cm-rule); border-radius: 0; box-shadow: none; background: #111d1759; font-size: 14px; }
.clean-menu .spbk-sh h4 { font: 600 20px/1.3 var(--f-ui); color: var(--cm-text); }
.clean-menu .spbk-spell h5 { font-size: 12px; text-transform: none; letter-spacing: 0; }
.clean-menu .spbk-units button small { font-size: 12px; }
.clean-menu .ptx-pause { border-top: 1px solid var(--cm-rule); margin-top: 12px; padding-top: 8px; }
.clean-menu .ptx-pause .seg { flex-wrap: wrap; }

@media (max-width: 700px) {
  .panel.pausep.clean-menu { width: min(480px, calc(var(--vw-safe) - 24px)); }
  .cm-pause { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .cm-nav, .cm-quick { padding: 20px; }
  .cm-nav-footer { margin-top: 16px; }
  .panel.pausep.clean-menu .cm-nav .ttl { font-size: 32px; }
  .cm-nav-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cm-nav-main #pRes { grid-column: 1 / -1; }
  .cm-settings-grid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .panel.clean-menu:not(.tal):not(.pausep) { padding: 18px; max-height: calc(var(--vh-safe) - 24px); }
  .clean-menu .cm-links { flex-wrap: wrap; }
  .cm-links button { flex-basis: 40%; }
}
@media (prefers-reduced-motion: reduce) { .clean-menu *, .clean-menu *::before, .clean-menu *::after { animation: none !important; transition: none !important; } }

/* Main menu: three open desktop columns; native, independent accordions on phones. */
.t2 *, .savesp .t2-list * { box-sizing: border-box; }
.ov.ov-title2 { display: block; padding: 0; overflow: auto; background: #0a1416 var(--t2bg, none) center 40% / cover no-repeat; }
.panel.title2 { width: 100%; max-width: none; min-height: 100%; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; text-align: left; }
.panel.title2::before { display: none; }
.t2 { position: relative; min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: max(24px, var(--sa-t)) max(24px, var(--sa-r)) max(20px, var(--sa-b)) max(24px, var(--sa-l)); color: var(--cm-text); font-family: var(--f-ui); }
.t2::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, #02080728 5%, transparent 30%, #0208075c 70%, #020807a6); }
.t2-fx { position: fixed; left: 0; top: 0; pointer-events: none; }
